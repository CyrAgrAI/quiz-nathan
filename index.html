<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Nathan</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>
* { box-sizing: border-box; } body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#0f0c29,#302b63,#24243e); min-height:100vh; color:#fff; padding:20px; }
.container { max-width:720px; margin:auto; } h1 { font-family:'Bangers',cursive; font-size:clamp(2.6rem,10vw,4rem); color:#ffd200; text-align:center; letter-spacing:3px; }
.subtitle { text-align:center; color:#a78bfa; margin-bottom:16px; } .quiz-list { display:flex; flex-direction:column; gap:7px; }
.quiz-item { height:88px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:8px 12px; text-decoration:none; color:#fff; display:flex; align-items:center; justify-content:flex-start; gap:10px; }
.quiz-item:nth-child(even) { background:rgba(124,58,237,.18); border-color:rgba(196,181,253,.25); }
.quiz-item:hover { background:rgba(124,58,237,.3); border-color:#7c3aed; } .quiz-info { display:flex; flex-direction:column; justify-content:flex-start; gap:2px; min-width:0; height:70px; }
.quiz-title { font-family:'Bangers',cursive; font-size:clamp(1rem,4vw,1.6rem); line-height:1.05; letter-spacing:.5px; color:#ffd200; overflow-wrap:anywhere; }
.quiz-prefix--violet { color:#c084fc; } .quiz-prefix--red { color:#f87171; } .quiz-prefix--blue { color:#60a5fa; } .quiz-prefix--green { color:#4ade80; }
.quiz-prefix--spanish { color:transparent; background:linear-gradient(90deg,#aa151b 0 33.333%,#f1bf00 33.333% 66.666%,#aa151b 66.666% 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.quiz-prefix--french { color:transparent; background:linear-gradient(90deg,#2563eb 0 33.333%,#fff 33.333% 66.666%,#ef4444 66.666% 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.quiz-date { font-size:.75rem; line-height:1; color:#c4b5fd; } .quiz-icon { width:1.5em; height:1em; vertical-align:-.1em; margin-right:.2em; } .quiz-type-icon { width:70px; height:70px; object-fit:contain; flex:none; } .quiz-arrow { color:#a78bfa; flex:none; margin-left:auto; } footer { text-align:center; margin-top:16px; font-size:.78rem; color:#9ca3af; }
.catalogue-search { background:rgba(124,58,237,.18); border:1px solid rgba(196,181,253,.3); border-radius:8px; padding:8px; margin-bottom:8px; }
.catalogue-search h2 { font-family:'Bangers',cursive; color:#ffd200; font-size:1.15rem; letter-spacing:.5px; margin:0 0 4px; }
.search-controls { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; } .search-field { display:flex; flex-direction:column; gap:2px; font-size:.68rem; line-height:1.1; color:#c4b5fd; }
.search-field--text { grid-column:span 2; } .search-field input,.search-field select { width:100%; min-height:34px; padding:5px; border-radius:6px; border:1px solid #a78bfa; background:#24243e; color:#fff; font:inherit; }
.search-field input:focus-visible,.search-field select:focus-visible { outline:2px solid #ffd200; outline-offset:2px; } .search-field select:disabled { opacity:.55; cursor:not-allowed; }
.icon-select { position:relative; }
.icon-select-button { display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; min-height:34px; padding:4px 6px; border:1px solid #a78bfa; border-radius:6px; background:#24243e; color:#fff; font:inherit; text-align:left; cursor:pointer; }
.icon-select-button:focus-visible { outline:2px solid #ffd200; outline-offset:2px; }
.icon-select-current { display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.icon-select-image { width:26px; height:26px; object-fit:contain; flex:none; }
.icon-select-flag { width:26px; height:18px; object-fit:cover; flex:none; border-radius:2px; }
.icon-select-list { position:absolute; z-index:5; top:calc(100% + 3px); left:0; right:0; max-height:180px; overflow:auto; padding:3px; border:1px solid #a78bfa; border-radius:6px; background:#24243e; box-shadow:0 4px 12px #0008; }
.icon-select-option { display:flex; align-items:center; gap:6px; width:100%; padding:4px; border:0; border-radius:4px; background:transparent; color:#fff; font:inherit; text-align:left; cursor:pointer; }
.icon-select-option:hover,.icon-select-option:focus-visible,.icon-select-option[aria-selected="true"] { outline:none; background:rgba(124,58,237,.4); }
.search-field .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.search-status { font-size:.68rem; line-height:1.2; color:#c4b5fd; margin:4px 0 0; } .search-empty { text-align:center; color:#c4b5fd; padding:20px; } [hidden] { display:none !important; }
@media(max-width:520px) { .search-controls { grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; } .search-field--text { grid-column:1 / -1; } }
</style></head>
<body><main class="container"><h1>Quiz Nathan</h1><p class="subtitle">Ouvre ton lien personnel pour retrouver tes quiz.</p><footer>Quiz de révision</footer></main></body></html>
