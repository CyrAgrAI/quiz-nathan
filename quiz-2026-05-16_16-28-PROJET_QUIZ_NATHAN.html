<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ VOCAB QUIZ ⚡ — Nathan</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .container { max-width: 680px; width: 100%; }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      text-align: center;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #a78bfa;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* HUD */
    .hud {
      display: flex;
      justify-content: space-around;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 18px;
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
    .hud span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hud .label { font-family: 'Poppins', sans-serif; font-size: 0.65rem; font-weight: 600; color: #a78bfa; letter-spacing: 0; }

    /* Progress */
    .progress-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      height: 8px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(to right, #7c3aed, #f97316);
      transition: width 0.4s ease;
      width: 0%;
    }

    /* Question card */
    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 28px 28px 22px;
      margin-bottom: 18px;
    }

    .direction-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 10px;
    }
    .direction-badge .flag-row { display: flex; align-items: center; gap: 10px; }
    .direction-badge img { height: 2.4rem; border-radius: 4px; display: block; }
    .direction-badge .arrow { font-size: 1.6rem; color: #a78bfa; }
    .direction-badge .flag-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; color: #a78bfa; }
    .badge-eng, .badge-fr { background: none; border: none; }

    .question-text {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .question-num {
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 0;
    }

    /* Buttons */
    .choices { display: flex; flex-direction: column; gap: 10px; }

    .choice-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 13px 18px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s;
    }
    .choice-btn:hover:not(:disabled) {
      background: rgba(124,58,237,0.3);
      border-color: #7c3aed;
      transform: translateY(-2px);
    }
    .choice-btn .letter {
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      color: #a78bfa;
      min-width: 22px;
    }

    .choice-btn.correct {
      background: rgba(34,197,94,0.2);
      border-color: #22c55e;
      animation: bounce 0.4s ease;
    }
    .choice-btn.wrong {
      background: rgba(239,68,68,0.2);
      border-color: #ef4444;
      animation: shake 0.4s ease;
    }
    .choice-btn:disabled { cursor: default; }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
      60% { transform: translateY(-3px); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Result */
    .result-screen {
      display: none;
      text-align: center;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 40px 28px;
    }
    .result-screen.visible { display: block; }

    .result-title {
      font-family: 'Bangers', cursive;
      font-size: 2.4rem;
      letter-spacing: 2px;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .result-stars { font-size: 2rem; margin-bottom: 16px; }
    .result-score {
      font-family: 'Bangers', cursive;
      font-size: 3.5rem;
      color: #ffd200;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    .result-details { color: #a78bfa; font-size: 0.9rem; margin-bottom: 24px; }

    .replay-btn {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      padding: 14px 36px;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .replay-btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .email-status { margin-top: 16px; font-size: 0.85rem; padding: 10px 18px; border-radius: 10px; font-weight: 600; display: none; }
    .email-status.sending { display: block; color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); }
    .email-status.sent    { display: block; color: #86efac; background: rgba(34,197,94,0.1);   border: 1px solid rgba(34,197,94,0.3); }
    .email-status.error   { display: block; color: #fca5a5; background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3); }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ VOCAB QUIZ ⚡</h1>
  <p class="subtitle" id="subtitle">The Commonwealth — p.88</p>

  <div class="hud">
    <span><div class="label">BONNES</div><div id="hud-correct">✅ 0</div></span>
    <span><div class="label">MAUVAISES</div><div id="hud-wrong">❌ 0</div></span>
    <span><div class="label">SCORE</div><div id="hud-pct">🎯 0%</div></span>
  </div>

  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>

  <div class="card" id="question-card">
    <div class="question-num" id="question-num">Question 1 / 16</div>
    <div id="direction-badge" class="direction-badge badge-eng"></div>
    <div class="question-text" id="question-text"></div>
    <div class="choices" id="choices"></div>
  </div>

  <div class="result-screen" id="result-screen">
    <div class="result-title" id="result-title"></div>
    <div class="result-stars" id="result-stars"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-details" id="result-details"></div>
    <button class="replay-btn" onclick="initQuiz()">🔄 REJOUER</button>
    <div class="email-status" id="email-status"></div>
  </div>
</div>

<script>
  const DEST_EMAIL      = "cyr.mail.internet@gmail.com";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQQK2X6W_11Pzwu2twbUqt7OHllyxhPFb3VHs0fXRp4Ulh_laKEv95NdyTpfOYmejNqg/exec";

  const VOCAB = [
    ["third", "le tiers"],
    ["half", "la moitié"],
    ["approximately", "approximativement"],
    ["share", "partager"],
    ["be ruled by", "être gouverné par"],
    ["at one time", "à un moment"],
    ["one in three", "un sur trois"],
    ["getting on", "s'approcher de"]
  ];

  const LETTERS = ["A", "B", "C", "D", "E"];

  const GB_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'%3E%3Crect width='60' height='30' fill='%23012169'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23C8102E' stroke-width='4'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23C8102E' stroke-width='6'/%3E%3C/svg%3E" alt="UK">`;
  const FR_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'%3E%3Crect width='1' height='2' fill='%23002395'/%3E%3Crect x='1' width='1' height='2' fill='%23EDEDED'/%3E%3Crect x='2' width='1' height='2' fill='%23ED2939'/%3E%3C/svg%3E" alt="FR">`;

  let questions = [];
  let currentIndex = 0;
  let correct = 0;
  let wrong = 0;
  let wrongAnswers = [];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    const qs = [];
    VOCAB.forEach(([eng, fr]) => {
      // ENG → FR
      qs.push({ prompt: eng, answer: fr, dir: "eng", pool: VOCAB.map(v => v[1]) });
      // FR → ENG
      qs.push({ prompt: fr, answer: eng, dir: "fr",  pool: VOCAB.map(v => v[0]) });
    });
    return shuffle(qs);
  }

  function getChoices(answer, pool) {
    const distractors = shuffle(pool.filter(v => v !== answer));
    const choices = shuffle([answer, ...distractors.slice(0, 4)]);
    return choices;
  }

  function initQuiz() {
    questions = buildQuestions();
    currentIndex = 0;
    correct = 0;
    wrong = 0;
    wrongAnswers = [];
    updateHUD();
    document.getElementById("result-screen").classList.remove("visible");
    document.getElementById("question-card").style.display = "block";
    showQuestion();
  }

  function updateHUD() {
    const total = correct + wrong;
    const pct = total > 0 ? Math.round(correct / total * 100) : 0;
    document.getElementById("hud-correct").textContent = "✅ " + correct;
    document.getElementById("hud-wrong").textContent   = "❌ " + wrong;
    document.getElementById("hud-pct").textContent     = "🎯 " + pct + "%";
  }

  function showQuestion() {
    const total = questions.length;
    const q = questions[currentIndex];

    // Progress
    document.getElementById("progress-bar").style.width = (currentIndex / total * 100) + "%";
    document.getElementById("question-num").textContent = "Question " + (currentIndex + 1) + " / " + total;

    // Direction badge
    const badge = document.getElementById("direction-badge");
    if (q.dir === "eng") {
      badge.innerHTML = `<div class="flag-row">${GB_SVG}<span class="arrow">→</span>${FR_SVG}</div><div class="flag-label">Anglais → Français</div>`;
      badge.className = "direction-badge badge-eng";
    } else {
      badge.innerHTML = `<div class="flag-row">${FR_SVG}<span class="arrow">→</span>${GB_SVG}</div><div class="flag-label">Français → Anglais</div>`;
      badge.className = "direction-badge badge-fr";
    }

    document.getElementById("question-text").textContent = q.prompt;

    const choices = getChoices(q.answer, q.pool);
    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    choices.forEach((choice, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${choice}</span>`;
      btn.addEventListener("click", () => handleAnswer(btn, choice, q, choices));
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(btn, selected, q, choices) {
    const btns = document.querySelectorAll(".choice-btn");
    btns.forEach(b => b.disabled = true);

    if (selected === q.answer) {
      btn.classList.add("correct");
      correct++;
    } else {
      btn.classList.add("wrong");
      wrong++;
      wrongAnswers.push({ prompt: q.prompt, correct: q.answer, dir: q.dir });
      // Highlight correct
      btns.forEach(b => {
        if (b.querySelector("span:last-child").textContent === q.answer) {
          b.classList.add("correct");
        }
      });
    }

    updateHUD();
    setTimeout(() => {
      currentIndex++;
      if (currentIndex < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById("progress-bar").style.width = "100%";
    document.getElementById("question-card").style.display = "none";
    const screen = document.getElementById("result-screen");
    screen.classList.add("visible");

    const total = questions.length;
    const pct = Math.round(correct / total * 100);

    let title, stars;
    if (pct >= 90) { title = "LÉGENDAIRE ! 🔥"; stars = "⭐⭐⭐⭐⭐"; }
    else if (pct >= 75) { title = "EXCELLENT ! 💪";   stars = "⭐⭐⭐⭐"; }
    else if (pct >= 55) { title = "BIEN JOUÉ ! 😎";   stars = "⭐⭐⭐"; }
    else if (pct >= 35) { title = "PAS MAL... 🤔";    stars = "⭐⭐"; }
    else                { title = "À RETRAVAILLER 😅"; stars = "⭐"; }

    document.getElementById("result-title").textContent   = title;
    document.getElementById("result-stars").textContent   = stars;
    document.getElementById("result-score").textContent   = pct + "%";
    document.getElementById("result-details").textContent = correct + " bonnes / " + wrong + " mauvaises sur " + total + " questions";

    sendResultEmail(correct, total, pct, stars);
  }

  function sendResultEmail(score, total, pct, stars) {
    const statusEl = document.getElementById("email-status");
    statusEl.className = "email-status sending";
    statusEl.textContent = "📧 Envoi du rapport en cours…";

    const body = JSON.stringify({
      score, total, pct, stars,
      date: new Date().toLocaleString("fr-FR"),
      dest: DEST_EMAIL,
      mots_rates: wrongAnswers
    });

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body
    })
    .then(() => {
      statusEl.className = "email-status sent";
      statusEl.textContent = "✅ Rapport envoyé à " + DEST_EMAIL;
    })
    .catch(() => {
      statusEl.className = "email-status error";
      statusEl.textContent = "⚠️ Erreur envoi — vérifie l'URL Apps Script";
    });
  }

  initQuiz();
</script>
</body>
</html>
