<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCAB QUIZ - Commonwealth p.89-91</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .app { width: min(760px, 100%); }
    h1 {
      font-family: 'Bangers', cursive;
      text-align: center;
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .progress-shell {
      height: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin: 0 auto 16px;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .progress-bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #7c3aed, #f7971e);
      transition: width 0.25s ease;
    }
    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 14px;
      box-shadow: 0 22px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(12px);
      padding: clamp(18px, 4vw, 30px);
    }
    .subtitle {
      text-align: center;
      color: #c4b5fd;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .question-num {
      font-family: 'Bangers', cursive;
      color: #ffd200;
      font-size: 1.45rem;
      letter-spacing: 1px;
      text-align: center;
      margin-bottom: 8px;
    }
    .direction-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      margin-bottom: 14px;
    }
    .flag-row { display: flex; align-items: center; gap: 10px; }
    .direction-badge img { height: 2.4rem; border-radius: 4px; display: block; }
    .arrow { color: #a78bfa; font-size: 1.6rem; }
    .flag-label {
      color: #a78bfa;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.4px;
    }
    .question-text {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Bangers', cursive;
      font-size: clamp(2rem, 8vw, 3.7rem);
      letter-spacing: 1px;
      line-height: 1.05;
      overflow-wrap: anywhere;
      margin: 12px 0 20px;
    }
    .word-en { color: #f87171; }
    .word-fr { color: #60a5fa; }
    .choices {
      display: grid;
      gap: 10px;
    }
    .choice-btn {
      display: grid;
      grid-template-columns: 38px 1fr;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      padding: 10px 14px 10px 10px;
    }
    .choice-btn:hover:not(:disabled) {
      background: rgba(124,58,237,0.35);
      border-color: #7c3aed;
      transform: translateY(-2px);
    }
    .choice-btn:focus { outline: none; box-shadow: none; }
    .choice-btn:disabled { cursor: default; }
    .letter {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.14);
      color: #ffd200;
      font-family: 'Bangers', cursive;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .choice-btn.correct { background: rgba(34,197,94,0.8); border-color: #22c55e; animation: bounce 0.45s ease; }
    .choice-btn.wrong { background: rgba(239,68,68,0.82); border-color: #ef4444; animation: shake 0.32s ease; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .card-bottom {
      position: relative;
      min-height: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      gap: 10px;
    }
    .hud-inline {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: clamp(8px, 3vw, 16px);
      white-space: nowrap;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; }
    .hud-val { font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px; }
    .hud-lbl { color: #a78bfa; font-size: 0.58rem; font-weight: 700; }
    .restart-btn, .next-btn {
      border-radius: 10px;
      border: 1px solid;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      cursor: pointer;
      min-height: 42px;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .restart-btn {
      background: rgba(156,163,175,0.15);
      border-color: #9ca3af;
      color: #d1d5db;
      padding: 10px 14px;
    }
    .next-btn {
      background: rgba(124,58,237,0.35);
      border-color: #7c3aed;
      padding: 10px 20px;
    }
    .restart-btn:hover, .next-btn:hover { transform: translateY(-1px); }
    .restart-btn:focus, .next-btn:focus { outline: none; }
    .next-btn-wrap { display: none; }
    .result { text-align: center; display: none; }
    .result-title {
      font-family: 'Bangers', cursive;
      color: #ffd200;
      font-size: clamp(2.4rem, 9vw, 4rem);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .stars { font-size: 2rem; margin-bottom: 12px; }
    .score-line { color: #ddd6fe; font-weight: 700; margin-bottom: 14px; }
    .missed {
      margin: 14px auto 0;
      max-width: 560px;
      text-align: left;
      color: #fecaca;
      font-size: 0.92rem;
      line-height: 1.45;
    }
    .missed h2 {
      color: #fca5a5;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .email-status {
      margin-top: 16px;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
    }
    .email-status.sending { display: block; color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); }
    .email-status.sent { display: block; color: #86efac; background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .email-status.error { display: block; color: #fca5a5; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); }
    @media (max-width: 580px) {
      body { align-items: flex-start; padding: 12px; }
      .card { padding: 16px; }
      .choice-btn { grid-template-columns: 34px 1fr; font-size: 0.9rem; }
      .card-bottom { align-items: stretch; }
      .hud-inline {
        position: static;
        transform: none;
        order: -1;
        justify-content: center;
        flex: 1 0 100%;
        margin-bottom: 8px;
      }
      .card-bottom { flex-wrap: wrap; }
      .restart-btn, .next-btn-wrap { flex: 1; }
      .next-btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>VOCAB QUIZ</h1>
    <div class="progress-shell"><div class="progress-bar" id="progress-bar"></div></div>

    <section class="card" id="question-card">
      <p class="subtitle" id="subtitle">Commonwealth - p.89-91</p>
      <div class="question-num" id="question-num">Question 1 / 38</div>
      <div id="direction-badge" class="direction-badge"></div>
      <div class="question-text" id="question-text"></div>
      <div class="choices" id="choices"></div>
      <div class="card-bottom">
        <button class="restart-btn" type="button" onclick="initQuiz()">Recommencer</button>
        <div class="hud-inline">
          <div class="hud-item"><span class="hud-val" id="hud-correct">0</span><span class="hud-lbl">Bonnes</span></div>
          <div class="hud-item"><span class="hud-val" id="hud-wrong">0</span><span class="hud-lbl">Mauvaises</span></div>
          <div class="hud-item"><span class="hud-val" id="hud-pct">0%</span><span class="hud-lbl">Score</span></div>
        </div>
        <div class="next-btn-wrap" id="next-btn-wrap">
          <button class="next-btn" type="button" onclick="nextQuestion()">Continuer</button>
        </div>
      </div>
    </section>

    <section class="card result" id="result-card">
      <div class="result-title" id="result-title"></div>
      <div class="stars" id="stars"></div>
      <p class="score-line" id="score-line"></p>
      <button class="next-btn" type="button" onclick="initQuiz()">REJOUER</button>
      <div class="email-status" id="email-status"></div>
      <div class="missed" id="missed"></div>
    </section>
  </main>

  <script>
    const DEST_EMAIL = "cyr.mail.internet@gmail.com";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQQK2X6W_11Pzwu2twbUqt7OHllyxhPFb3VHs0fXRp4Ulh_laKEv95NdyTpfOYmejNqg/exec";

    const VOCAB = [
      ["membership", "adhésion"],
      ["common values", "valeurs communes"],
      ["join", "intégrer"],
      ["promote", "promouvoir"],
      ["become a member", "devenir membre"],
      ["on an equal footing / equal status", "à égalité"],
      ["be bound by", "être lié par"],
      ["coral reef", "récif corallien"],
      ["beach", "plage"],
      ["palm tree", "palmier"],
      ["citizen", "citoyen"],
      ["$100 thousand", "cent mille dollars"],
      ["$50 million", "cinquante millions de dollars"],
      ["thousands of dollars", "des milliers de dollars"],
      ["joy", "bonheur"],
      ["host city", "ville organisatrice"],
      ["youth", "jeunesse"],
      ["together", "ensemble"],
      ["take place", "avoir lieu, se dérouler"]
    ];

    const GB_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'%3E%3Crect width='60' height='30' fill='%23012169'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23C8102E' stroke-width='4'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23C8102E' stroke-width='6'/%3E%3C/svg%3E" alt="UK">`;
    const FR_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'%3E%3Crect width='1' height='2' fill='%23002395'/%3E%3Crect x='1' width='1' height='2' fill='%23EDEDED'/%3E%3Crect x='2' width='1' height='2' fill='%23ED2939'/%3E%3C/svg%3E" alt="FR">`;

    let questions = [];
    let currentIndex = 0;
    let correct = 0;
    let wrong = 0;
    let wrongAnswers = [];

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeQuestions() {
      const eng = VOCAB.map(([en, fr]) => ({ dir: "eng", prompt: en, answer: fr }));
      const fr = VOCAB.map(([en, fr]) => ({ dir: "fr", prompt: fr, answer: en }));
      return shuffle([...eng, ...fr]).map(q => {
        const pool = q.dir === "eng" ? VOCAB.map(pair => pair[1]) : VOCAB.map(pair => pair[0]);
        const distractors = shuffle(pool.filter(item => item !== q.answer)).slice(0, 4);
        return { ...q, choices: shuffle([q.answer, ...distractors]) };
      });
    }

    function initQuiz() {
      questions = makeQuestions();
      currentIndex = 0;
      correct = 0;
      wrong = 0;
      wrongAnswers = [];
      document.getElementById("question-card").style.display = "block";
      document.getElementById("result-card").style.display = "none";
      document.getElementById("email-status").className = "email-status";
      document.getElementById("email-status").textContent = "";
      updateHUD();
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentIndex];
      document.getElementById("next-btn-wrap").style.display = "none";
      document.getElementById("question-num").textContent = `Question ${currentIndex + 1} / ${questions.length}`;
      document.getElementById("progress-bar").style.width = `${(currentIndex / questions.length) * 100}%`;

      const badge = document.getElementById("direction-badge");
      if (q.dir === "eng") {
        badge.innerHTML = `<div class="flag-row">${GB_SVG}<span class="arrow">→</span>${FR_SVG}</div><div class="flag-label">Anglais → Français</div>`;
      } else {
        badge.innerHTML = `<div class="flag-row">${FR_SVG}<span class="arrow">→</span>${GB_SVG}</div><div class="flag-label">Français → Anglais</div>`;
      }

      const questionText = document.getElementById("question-text");
      questionText.textContent = q.prompt;
      questionText.className = "question-text " + (q.dir === "eng" ? "word-en" : "word-fr");

      const choices = document.getElementById("choices");
      choices.innerHTML = "";
      q.choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-btn";
        button.innerHTML = `<span class="letter">${String.fromCharCode(65 + index)}</span><span>${choice}</span>`;
        button.addEventListener("click", () => handleAnswer(button, choice, q));
        choices.appendChild(button);
      });
    }

    function handleAnswer(button, selected, q) {
      const buttons = document.querySelectorAll(".choice-btn");
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.blur();
      });

      if (selected === q.answer) {
        button.classList.add("correct");
        correct++;
        updateHUD();
        setTimeout(nextQuestion, 850);
      } else {
        button.classList.add("wrong");
        wrong++;
        wrongAnswers.push({ prompt: q.prompt, correct: q.answer, dir: q.dir });
        buttons.forEach(btn => {
          const text = btn.querySelector("span:last-child").textContent;
          if (text === q.answer) btn.classList.add("correct");
        });
        updateHUD();
        document.getElementById("next-btn-wrap").style.display = "block";
      }
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < questions.length) showQuestion();
      else showResult();
    }

    function updateHUD() {
      const totalAnswered = correct + wrong;
      const pct = totalAnswered ? Math.round((correct / totalAnswered) * 100) : 0;
      document.getElementById("hud-correct").textContent = correct;
      document.getElementById("hud-wrong").textContent = wrong;
      document.getElementById("hud-pct").textContent = pct + "%";
    }

    function showResult() {
      const total = questions.length;
      const pct = Math.round((correct / total) * 100);
      let title = "À RETRAVAILLER";
      let stars = "⭐";
      if (pct >= 90) { title = "LÉGENDAIRE !"; stars = "⭐⭐⭐⭐⭐"; }
      else if (pct >= 75) { title = "EXCELLENT !"; stars = "⭐⭐⭐⭐"; }
      else if (pct >= 55) { title = "BIEN JOUÉ !"; stars = "⭐⭐⭐"; }
      else if (pct >= 35) { title = "PAS MAL..."; stars = "⭐⭐"; }

      document.getElementById("progress-bar").style.width = "100%";
      document.getElementById("question-card").style.display = "none";
      document.getElementById("result-card").style.display = "block";
      document.getElementById("result-title").textContent = title;
      document.getElementById("stars").textContent = stars;
      document.getElementById("score-line").textContent = `${correct} / ${total} bonnes réponses - ${pct}%`;

      const missed = document.getElementById("missed");
      if (wrongAnswers.length) {
        missed.innerHTML = `<h2>Mots à revoir</h2>${wrongAnswers.map(item => `<div>${item.prompt} → ${item.correct}</div>`).join("")}`;
      } else {
        missed.innerHTML = "";
      }

      sendResultEmail(pct, total, stars);
    }

    function sendResultEmail(pct, total, stars) {
      const status = document.getElementById("email-status");
      const date = new Date().toLocaleString("fr-FR");
      status.className = "email-status sending";
      status.textContent = "Envoi du rapport en cours...";

      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ score: correct, total, pct, stars, date, dest: DEST_EMAIL, mots_rates: wrongAnswers })
      }).then(() => {
        status.className = "email-status sent";
        status.textContent = "Rapport envoyé à " + DEST_EMAIL;
      }).catch(() => {
        status.className = "email-status error";
        status.textContent = "Erreur envoi - vérifie l'URL Apps Script";
      });
    }

    initQuiz();
  </script>
</body>
</html>
