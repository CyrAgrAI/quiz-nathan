<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ VOCAB QUIZ ⚡ — Nathan</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .container { max-width: 680px; width: 100%; }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 3rem;
      text-align: center;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 12px 20px;
      margin-bottom: 14px;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #7c3aed, #f97316);
      border-radius: 8px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .q-counter {
      text-align: center;
      font-size: 0.82rem;
      color: #a78bfa;
      margin-bottom: 16px;
    }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px;
    }

    .direction-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .badge-eng { background: rgba(59,130,246,0.25); color: #93c5fd; border: 1px solid rgba(59,130,246,0.5); }
    .badge-fr  { background: rgba(249,115,22,0.25);  color: #fdba74; border: 1px solid rgba(249,115,22,0.5); }

    .question-text {
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 26px;
      line-height: 1.3;
    }

    .choices { display: flex; flex-direction: column; gap: 11px; }

    .choice-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 12px;
      padding: 13px 18px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.93rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .choice-btn:hover:not(:disabled) {
      background: rgba(124,58,237,0.3);
      border-color: #7c3aed;
      transform: translateY(-2px);
    }

    .choice-letter {
      font-family: 'Bangers', cursive;
      font-size: 1.15rem;
      min-width: 26px;
      text-align: center;
      color: #a78bfa;
      flex-shrink: 0;
    }

    .choice-btn.correct {
      background: rgba(34,197,94,0.2);
      border-color: #22c55e;
      animation: bounce 0.45s ease;
    }

    .choice-btn.wrong {
      background: rgba(239,68,68,0.2);
      border-color: #ef4444;
      animation: shake 0.4s ease;
    }

    .choice-btn:disabled { cursor: not-allowed; opacity: 0.85; }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      30%      { transform: translateY(-9px); }
      60%      { transform: translateY(-4px); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-7px); }
      40%     { transform: translateX(7px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    #result-screen { text-align: center; display: none; }

    .result-title {
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .stars { font-size: 2.2rem; margin-bottom: 18px; }

    .score-detail { font-size: 1.1rem; color: #c4b5fd; margin-bottom: 26px; }

    .replay-btn {
      background: linear-gradient(to right, #7c3aed, #f97316);
      border: none;
      color: #fff;
      padding: 14px 38px;
      border-radius: 50px;
      font-family: 'Bangers', cursive;
      font-size: 1.4rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .replay-btn:hover { transform: scale(1.05); opacity: 0.9; }

    .email-status { margin-top: 16px; font-size: 0.85rem; padding: 10px 18px; border-radius: 10px; font-weight: 600; display: none; }
    .email-status.sending { display: block; color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); }
    .email-status.sent    { display: block; color: #86efac; background: rgba(34,197,94,0.1);   border: 1px solid rgba(34,197,94,0.3); }
    .email-status.error   { display: block; color: #fca5a5; background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3); }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ VOCAB QUIZ ⚡</h1>

  <div id="quiz-screen">
    <div class="hud">
      <span id="hud-correct">✅ 0</span>
      <span id="hud-wrong">❌ 0</span>
      <span id="hud-score">🎯 —</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="q-counter" id="q-counter"></div>
    <div class="card">
      <div id="direction-badge" class="direction-badge badge-eng"></div>
      <div class="question-text" id="question-text"></div>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <div class="card" id="result-screen">
    <div class="result-title" id="result-title"></div>
    <div class="stars" id="result-stars"></div>
    <div class="score-detail" id="score-detail"></div>
    <button class="replay-btn" onclick="startQuiz()">🔄 REJOUER</button>
    <div class="email-status" id="email-status"></div>
  </div>
</div>

<script>
const DEST_EMAIL      = "cyr.mail.internet@gmail.com";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQQK2X6W_11Pzwu2twbUqt7OHllyxhPFb3VHs0fXRp4Ulh_laKEv95NdyTpfOYmejNqg/exec";

const VOCAB = [
  ["third", "le tiers"],
  ["half", "la moitié"],
  ["approximately", "approximativement"],
  ["share", "partager"],
  ["be ruled by", "être gouverné par"],
  ["at one time", "à un moment"],
  ["one in three", "un sur trois"],
  ["getting on for", "s'approcher de"]
];

let questions = [], currentQ = 0, score = 0, wrongCount = 0, wrongAnswers = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  const qs = [];
  VOCAB.forEach(([eng, fr]) => {
    qs.push({ dir: 'eng', prompt: eng, correct: fr });
    qs.push({ dir: 'fr',  prompt: fr,  correct: eng });
  });
  return shuffle(qs);
}

function getDistractors(correct, dir) {
  const pool = VOCAB
    .map(([eng, fr]) => dir === 'eng' ? fr : eng)
    .filter(v => v !== correct);
  return shuffle(pool).slice(0, 4);
}

function startQuiz() {
  questions    = buildQuestions();
  currentQ     = 0;
  score        = 0;
  wrongCount   = 0;
  wrongAnswers = [];
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display   = 'block';
  showQuestion();
}

function showQuestion() {
  const q     = questions[currentQ];
  const total = questions.length;

  document.getElementById('hud-correct').textContent = `✅ ${score}`;
  document.getElementById('hud-wrong').textContent   = `❌ ${wrongCount}`;
  const pct = currentQ > 0 ? Math.round((score / currentQ) * 100) + '%' : '—';
  document.getElementById('hud-score').textContent = `🎯 ${pct}`;

  document.getElementById('progress-fill').style.width = `${(currentQ / total) * 100}%`;
  document.getElementById('q-counter').textContent     = `Question ${currentQ + 1} / ${total}`;

  const badge = document.getElementById('direction-badge');
  if (q.dir === 'eng') {
    badge.textContent = '🇬🇧 → 🇫🇷 Anglais → Français';
    badge.className   = 'direction-badge badge-eng';
  } else {
    badge.textContent = '🇫🇷 → 🇬🇧 Français → Anglais';
    badge.className   = 'direction-badge badge-fr';
  }

  document.getElementById('question-text').textContent = q.prompt;

  const choices = shuffle([q.correct, ...getDistractors(q.correct, q.dir)]);
  const letters = ['A','B','C','D','E'];
  const container = document.getElementById('choices');
  container.innerHTML = '';

  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.value = choice;
    btn.innerHTML = `<span class="choice-letter">${letters[i]}</span>${choice}`;
    btn.addEventListener('click', () => handleAnswer(btn, choice, q));
    container.appendChild(btn);
  });
}

function handleAnswer(btn, chosen, q) {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

  if (chosen === q.correct) {
    btn.classList.add('correct');
    score++;
  } else {
    btn.classList.add('wrong');
    wrongAnswers.push({ prompt: q.prompt, correct: q.correct, dir: q.dir });
    wrongCount++;
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.dataset.value === q.correct) b.classList.add('correct');
    });
  }

  setTimeout(() => {
    currentQ++;
    if (currentQ < questions.length) showQuestion();
    else showResult();
  }, 950);
}

function showResult() {
  document.getElementById('quiz-screen').style.display  = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const total = questions.length;
  const pct   = Math.round((score / total) * 100);

  let title, stars;
  if      (pct >= 90) { title = 'LÉGENDAIRE ! 🔥';  stars = '⭐⭐⭐⭐⭐'; }
  else if (pct >= 75) { title = 'EXCELLENT ! 💪';   stars = '⭐⭐⭐⭐'; }
  else if (pct >= 55) { title = 'BIEN JOUÉ ! 😎';   stars = '⭐⭐⭐'; }
  else if (pct >= 35) { title = 'PAS MAL... 🤔';    stars = '⭐⭐'; }
  else                { title = 'À RETRAVAILLER 😅'; stars = '⭐'; }

  document.getElementById('result-title').textContent = title;
  document.getElementById('result-stars').textContent = stars;
  document.getElementById('score-detail').textContent = `${score} / ${total} — ${pct}%`;

  sendResultEmail(score, total, pct, stars);
}

function sendResultEmail(score, total, pct, stars) {
  const el = document.getElementById('email-status');
  el.textContent = '📧 Envoi du rapport en cours…';
  el.className   = 'email-status sending';

  fetch(APPS_SCRIPT_URL, {
    method:  'POST',
    mode:    'no-cors',
    headers: { 'Content-Type': 'text/plain' },
    body:    JSON.stringify({
      score, total, pct, stars,
      date:       new Date().toLocaleString('fr-FR'),
      dest:       DEST_EMAIL,
      mots_rates: wrongAnswers
    })
  })
  .then(() => {
    el.textContent = '✅ Rapport envoyé à ' + DEST_EMAIL;
    el.className   = 'email-status sent';
  })
  .catch(() => {
    el.textContent = "⚠️ Erreur envoi — vérifie l'URL Apps Script";
    el.className   = 'email-status error';
  });
}

startQuiz();
</script>
</body>
</html>
