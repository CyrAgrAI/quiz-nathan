<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ VOCAB QUIZ — Commonwealth p.88</title>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    .container { max-width: 560px; width: 100%; }

    h1 {
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      text-align: center;
      background: linear-gradient(to right, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }

    .progress-bar-wrap { background: rgba(255,255,255,0.1); border-radius: 8px; height: 8px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(to right, #7c3aed, #f97316); border-radius: 8px; transition: width 0.4s ease; }

    .card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 26px 28px 20px;
    }

    /* En-tête carte */
    .card-top { display: flex; flex-direction: column; margin-bottom: 14px; }

    /* Titre du chapitre source */
    .subtitle { text-align: center; color: #a78bfa; font-size: 1.15rem; font-weight: 600; margin-bottom: 10px; }

    /* Numéro de question */
    .question-num { font-family: 'Bangers', cursive; font-size: 1.4rem; color: #ffd200; letter-spacing: 1px; margin-bottom: 4px; }

    /* Drapeaux direction */
    .direction-badge { display: flex; flex-direction: column; align-items: center; gap: 5px; margin-bottom: 10px; }
    .direction-badge .flag-row { display: flex; align-items: center; gap: 10px; }
    .direction-badge img { height: 2.4rem; border-radius: 4px; display: block; }
    .direction-badge .arrow { font-size: 1.6rem; color: #a78bfa; }
    .direction-badge .flag-label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.5px; color: #a78bfa; }
    .badge-eng, .badge-fr { background: none; border: none; }

    /* Mot à traduire */
    .question-text {
      font-size: 1.7rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 22px;
      min-height: 2.2rem;
    }
    .question-text.word-en { color: #f87171; }
    .question-text.word-fr { color: #60a5fa; }

    /* Boutons choix */
    .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }

    .choice-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s;
      text-align: left;
    }
    .choice-btn:hover:not(:disabled) { background: rgba(124,58,237,0.35); border-color: #7c3aed; transform: translateY(-2px); }
    .choice-btn:focus { outline: none; box-shadow: none; }
    .choice-btn:disabled { cursor: default; }

    .choice-btn .letter {
      font-family: 'Bangers', cursive;
      font-size: 1.1rem;
      color: #a78bfa;
      width: 22px;
      flex-shrink: 0;
    }

    .choice-btn.correct { background: rgba(34,197,94,0.25); border-color: #22c55e; animation: bounce 0.4s; }
    .choice-btn.wrong   { background: rgba(239,68,68,0.25);  border-color: #ef4444; animation: shake 0.4s; }

    @keyframes bounce {
      0%,100% { transform: translateY(0); }
      40%      { transform: translateY(-8px); }
      60%      { transform: translateY(-4px); }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-6px); }
      40%,80% { transform: translateX(6px); }
    }

    /* Bas de carte */
    .card-bottom {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      min-height: 44px;
    }

    .hud-inline {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .hud-item { display: flex; flex-direction: column; align-items: center; }
    .hud-val { font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px; }
    .hud-lbl { font-family: 'Poppins', sans-serif; font-size: 0.58rem; font-weight: 600; color: #a78bfa; }

    .restart-btn {
      background: rgba(156,163,175,0.15);
      border: 1px solid #9ca3af;
      border-radius: 10px;
      padding: 10px 18px;
      color: #d1d5db;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .restart-btn:hover { background: rgba(156,163,175,0.35); transform: translateY(-1px); }
    .restart-btn:focus { outline: none; }

    .next-btn-wrap { display: none; }
    .next-btn {
      background: rgba(124,58,237,0.35);
      border: 1px solid #7c3aed;
      border-radius: 10px;
      padding: 10px 24px;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .next-btn:hover { background: rgba(124,58,237,0.6); transform: translateY(-1px); }
    .next-btn:focus { outline: none; }

    /* Écran résultat */
    .result-card {
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      display: none;
    }

    .result-title { font-family: 'Bangers', cursive; font-size: 2.4rem; letter-spacing: 2px; margin-bottom: 10px; background: linear-gradient(to right, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .result-stars { font-size: 2rem; margin-bottom: 14px; }
    .result-score { font-size: 1.15rem; color: #c4b5fd; margin-bottom: 20px; }
    .result-pct { font-family: 'Bangers', cursive; font-size: 3rem; color: #ffd200; }

    .replay-btn {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 12px;
      padding: 14px 36px;
      color: #fff;
      font-family: 'Bangers', cursive;
      font-size: 1.3rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }
    .replay-btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .email-status { margin-top: 16px; font-size: 0.85rem; padding: 10px 18px; border-radius: 10px; font-weight: 600; display: none; }
    .email-status.sending { display: block; color: #a78bfa; background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); }
    .email-status.sent    { display: block; color: #86efac; background: rgba(34,197,94,0.1);   border: 1px solid rgba(34,197,94,0.3); }
    .email-status.error   { display: block; color: #fca5a5; background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.3); }
  </style>
</head>
<body>
<div class="container">
  <h1>⚡ VOCAB QUIZ ⚡</h1>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>

  <div class="card" id="question-card">
    <div class="card-top">
      <p class="subtitle" id="subtitle">Commonwealth — p.88</p>
      <div class="question-num" id="question-num">Question 1 / 16</div>
      <div id="direction-badge" class="direction-badge badge-eng"></div>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="choices" id="choices"></div>
    <div class="card-bottom">
      <button class="restart-btn" onclick="initQuiz()">🔄 Recommencer</button>
      <div class="hud-inline">
        <div class="hud-item"><span class="hud-val" id="hud-correct">✅ 0</span><span class="hud-lbl">Bonnes</span></div>
        <div class="hud-item"><span class="hud-val" id="hud-wrong">❌ 0</span><span class="hud-lbl">Mauvaises</span></div>
        <div class="hud-item"><span class="hud-val" id="hud-pct">🎯 0%</span><span class="hud-lbl">Score</span></div>
      </div>
      <div class="next-btn-wrap" id="next-btn-wrap">
        <button class="next-btn" onclick="nextQuestion()">Continuer →</button>
      </div>
    </div>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-title" id="result-title"></div>
    <div class="result-stars" id="result-stars"></div>
    <div class="result-score">
      <div class="result-pct" id="result-pct"></div>
      <div id="result-detail"></div>
    </div>
    <button class="replay-btn" onclick="initQuiz()">🔄 REJOUER</button>
    <div class="email-status" id="email-status"></div>
  </div>
</div>

<script>
  const DEST_EMAIL      = "cyr.mail.internet@gmail.com";
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQQK2X6W_11Pzwu2twbUqt7OHllyxhPFb3VHs0fXRp4Ulh_laKEv95NdyTpfOYmejNqg/exec";

  const VOCAB = [
    ["third", "le tiers"],
    ["half", "la moitié"],
    ["approximately", "approximativement"],
    ["share", "partager"],
    ["be ruled by", "être gouverné par"],
    ["at one time", "à un moment"],
    ["one in three", "un sur trois"],
    ["getting on", "s'approcher de"]
  ];

  const GB_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'%3E%3Crect width='60' height='30' fill='%23012169'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23fff' stroke-width='6'/%3E%3Cpath d='M0,0 L60,30 M60,0 L0,30' stroke='%23C8102E' stroke-width='4'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M30,0 V30 M0,15 H60' stroke='%23C8102E' stroke-width='6'/%3E%3C/svg%3E" alt="UK">`;
  const FR_SVG = `<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'%3E%3Crect width='1' height='2' fill='%23002395'/%3E%3Crect x='1' width='1' height='2' fill='%23EDEDED'/%3E%3Crect x='2' width='1' height='2' fill='%23ED2939'/%3E%3C/svg%3E" alt="FR">`;
  const LETTERS = ["A","B","C","D","E"];

  let questions = [], currentIndex = 0, correct = 0, wrong = 0, wrongAnswers = [];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    const engPool = VOCAB.map(p => p[1]);
    const frPool  = VOCAB.map(p => p[0]);
    const qs = [];

    VOCAB.forEach(([eng, fr]) => {
      // ENG → FR
      const distractorsEng = shuffle(engPool.filter(x => x !== fr)).slice(0, 4);
      const choicesEng = shuffle([fr, ...distractorsEng]);
      qs.push({ dir: "eng", prompt: eng, answer: fr, choices: choicesEng });

      // FR → ENG
      const distractorsFr = shuffle(frPool.filter(x => x !== eng)).slice(0, 4);
      const choicesFr = shuffle([eng, ...distractorsFr]);
      qs.push({ dir: "fr", prompt: fr, answer: eng, choices: choicesFr });
    });

    return shuffle(qs);
  }

  function initQuiz() {
    questions = buildQuestions();
    currentIndex = 0; correct = 0; wrong = 0; wrongAnswers = [];
    document.getElementById("question-card").style.display = "";
    document.getElementById("result-card").style.display = "none";
    updateHUD();
    showQuestion();
  }

  function updateHUD() {
    const total = correct + wrong;
    const pct = total > 0 ? Math.round(correct / total * 100) : 0;
    document.getElementById("hud-correct").textContent = "✅ " + correct;
    document.getElementById("hud-wrong").textContent   = "❌ " + wrong;
    document.getElementById("hud-pct").textContent     = "🎯 " + pct + "%";
  }

  function showQuestion() {
    const q = questions[currentIndex];
    const total = questions.length;

    document.getElementById("progress-bar").style.width = (currentIndex / total * 100) + "%";
    document.getElementById("question-num").textContent = "Question " + (currentIndex + 1) + " / " + total;
    document.getElementById("next-btn-wrap").style.display = "none";

    const badge = document.getElementById("direction-badge");
    if (q.dir === "eng") {
      badge.innerHTML = `<div class="flag-row">${GB_SVG}<span class="arrow">→</span>${FR_SVG}</div><div class="flag-label">Anglais → Français</div>`;
      badge.className = "direction-badge badge-eng";
    } else {
      badge.innerHTML = `<div class="flag-row">${FR_SVG}<span class="arrow">→</span>${GB_SVG}</div><div class="flag-label">Français → Anglais</div>`;
      badge.className = "direction-badge badge-fr";
    }

    const qtEl = document.getElementById("question-text");
    qtEl.textContent = q.prompt;
    qtEl.className = "question-text " + (q.dir === "eng" ? "word-en" : "word-fr");

    const choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    q.choices.forEach((choice, i) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="letter">${LETTERS[i]}</span><span>${choice}</span>`;
      btn.onclick = () => handleAnswer(btn, choice, q);
      choicesEl.appendChild(btn);
    });
  }

  function handleAnswer(btn, selected, q) {
    const btns = document.querySelectorAll(".choice-btn");
    btns.forEach(b => { b.disabled = true; b.blur(); });

    if (selected === q.answer) {
      btn.classList.add("correct");
      correct++;
      updateHUD();
      setTimeout(nextQuestion, 1000);
    } else {
      btn.classList.add("wrong");
      wrong++;
      wrongAnswers.push({ prompt: q.prompt, correct: q.answer, dir: q.dir });
      btns.forEach(b => {
        if (b.querySelector("span:last-child").textContent === q.answer) b.classList.add("correct");
      });
      updateHUD();
      document.getElementById("next-btn-wrap").style.display = "block";
    }
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < questions.length) { showQuestion(); }
    else { showResult(); }
  }

  function showResult() {
    document.getElementById("question-card").style.display = "none";
    const result = document.getElementById("result-card");
    result.style.display = "block";

    const total = questions.length;
    const pct = Math.round(correct / total * 100);
    let title, stars;
    if (pct >= 90)      { title = "LÉGENDAIRE ! 🔥"; stars = "⭐⭐⭐⭐⭐"; }
    else if (pct >= 75) { title = "EXCELLENT ! 💪";  stars = "⭐⭐⭐⭐"; }
    else if (pct >= 55) { title = "BIEN JOUÉ ! 😎";  stars = "⭐⭐⭐"; }
    else if (pct >= 35) { title = "PAS MAL... 🤔";   stars = "⭐⭐"; }
    else                { title = "À RETRAVAILLER 😅"; stars = "⭐"; }

    document.getElementById("result-title").textContent  = title;
    document.getElementById("result-stars").textContent  = stars;
    document.getElementById("result-pct").textContent    = pct + "%";
    document.getElementById("result-detail").textContent = correct + " / " + total + " bonnes réponses";

    document.getElementById("progress-bar").style.width = "100%";
    sendResultEmail(pct, total, stars);
  }

  function sendResultEmail(pct, total, stars) {
    const statusEl = document.getElementById("email-status");
    statusEl.className = "email-status sending";
    statusEl.textContent = "📧 Envoi du rapport en cours…";

    const date = new Date().toLocaleDateString("fr-FR", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ score: correct, total, pct, stars, date, dest: DEST_EMAIL, mots_rates: wrongAnswers })
    })
    .then(() => {
      statusEl.className = "email-status sent";
      statusEl.textContent = "✅ Rapport envoyé à " + DEST_EMAIL;
    })
    .catch(() => {
      statusEl.className = "email-status error";
      statusEl.textContent = "⚠️ Erreur envoi — vérifie l'URL Apps Script";
    });
  }

  initQuiz();
</script>
</body>
</html>
