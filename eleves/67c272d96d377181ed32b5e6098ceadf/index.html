<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes quiz — Elève TEST</title><link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><style>
* { box-sizing: border-box; } body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg,#0f0c29,#302b63,#24243e); min-height:100vh; color:#fff; padding:20px; }
.container { max-width:720px; margin:auto; } h1 { font-family:'Bangers',cursive; font-size:clamp(2.6rem,10vw,4rem); color:#ffd200; text-align:center; letter-spacing:3px; }
.subtitle { text-align:center; color:#a78bfa; margin-bottom:28px; } .quiz-list { display:flex; flex-direction:column; gap:12px; }
.quiz-item { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:18px 22px; text-decoration:none; color:#fff; display:flex; align-items:center; justify-content:space-between; gap:14px; }
.quiz-item:hover { background:rgba(124,58,237,.25); border-color:#7c3aed; } .quiz-info { display:flex; flex-direction:column; gap:4px; min-width:0; }
.quiz-title { font-family:'Bangers',cursive; font-size:1.6rem; letter-spacing:1px; color:#ffd200; overflow-wrap:anywhere; }
.quiz-prefix--violet { color:#c084fc; } .quiz-prefix--red { color:#f87171; } .quiz-prefix--blue { color:#60a5fa; } .quiz-prefix--green { color:#4ade80; }
.quiz-prefix--french { color:transparent; background:linear-gradient(90deg,#2563eb 0 33.333%,#fff 33.333% 66.666%,#ef4444 66.666% 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.quiz-date { font-size:.85rem; color:#c4b5fd; } .quiz-icon { width:1.5em; height:1em; vertical-align:-.1em; margin-right:.2em; } .quiz-arrow { color:#a78bfa; } footer { text-align:center; margin-top:28px; font-size:.78rem; color:#9ca3af; }
.catalogue-search { background:rgba(124,58,237,.18); border:1px solid rgba(196,181,253,.3); border-radius:8px; padding:8px; margin-bottom:8px; }
.catalogue-search h2 { font-family:'Bangers',cursive; color:#ffd200; font-size:1.15rem; letter-spacing:.5px; margin:0 0 4px; }
.search-controls { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; } .search-field { display:flex; flex-direction:column; gap:2px; font-size:.68rem; line-height:1.1; color:#c4b5fd; }
.search-field--text { grid-column:span 2; } .search-field input,.search-field select { width:100%; min-height:34px; padding:5px; border-radius:6px; border:1px solid #a78bfa; background:#24243e; color:#fff; font:inherit; }
.search-field input:focus-visible,.search-field select:focus-visible { outline:2px solid #ffd200; outline-offset:2px; } .search-field select:disabled { opacity:.55; cursor:not-allowed; }
.search-status { font-size:.68rem; line-height:1.2; color:#c4b5fd; margin:4px 0 0; } .search-empty { text-align:center; color:#c4b5fd; padding:20px; } [hidden] { display:none !important; }
@media(max-width:520px) { .search-controls { grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; } .search-field--text { grid-column:1 / -1; } }
</style></head>
<body><main class="container"><h1>Mes quiz — Elève TEST</h1>
<section class="catalogue-search" aria-labelledby="search-title">
<h2 id="search-title">Rechercher un quiz</h2>
<div class="search-controls">
<label class="search-field search-field--text">Recherche<input id="search-text" type="search" placeholder="Titre, thème, langue…" autocomplete="off"></label>
<label class="search-field">Correspondance<select id="search-mode"><option value="partial">🔎 Mot partiel</option><option value="whole">🎯 Mot entier</option></select></label>
<label class="search-field">Type / thème<select id="search-category"><option value="">📂 Tous les types</option></select></label>
<label class="search-field">Langue<select id="search-language"><option value="">🌍 Toutes les langues</option></select></label>
<label class="search-field">Format<select id="search-format" aria-describedby="format-help"><option value="">🧩 Tous les formats</option></select></label>
</div><p id="format-help" class="search-status">Quiz/QCM : vocabulaire uniquement.</p>
<p id="search-count" class="search-status" role="status" aria-live="polite"></p>
</section>
<p class="subtitle">Choisis un quiz pour t’entraîner</p><div class="quiz-list"><a class="quiz-item" data-category="conjugation" data-languages="unknown" data-format="" data-search="Conjugaison Estar Llamarse" href="quiz-2026-10-06_10-34-Conjugaison_Estar%20Llamarse.html"><div class="quiz-info"><span class="quiz-title"><svg class="quiz-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m14 5 5 5"/></svg> <span class="quiz-prefix quiz-prefix--violet">Conjugaison</span> Estar Llamarse</span><span class="quiz-date">6 octobre 2026 à 10:34</span></div><span class="quiz-arrow">▶</span></a></div><p id="search-empty" class="search-empty" hidden>Aucun quiz ne correspond à ta recherche.</p>
<script>
(() => {
  const cards = Array.from(document.querySelectorAll('.quiz-item'));
  const text = document.getElementById('search-text');
  const mode = document.getElementById('search-mode');
  const category = document.getElementById('search-category');
  const language = document.getElementById('search-language');
  const format = document.getElementById('search-format');
  const normalize = value => value.normalize('NFD').replace(/\p{M}/gu, '').toLocaleLowerCase('fr');
  const words = value => normalize(value).match(/[\p{L}\p{N}]+/gu) || [];
  const labels = { vocabulary:'📚 Vocabulaire', conjugation:'✍️ Conjugaison', other:'🗂️ Autre', es:'🇪🇸 Espagnol', en:'🇬🇧 Anglais', fr:'🇫🇷 Français', unknown:'❔ Non précisée', quiz:'📝 Quiz', qcm:'☑️ QCM' };
  const fill = (select, values) => {
    [...new Set(values)].sort().forEach(value => select.add(new Option(labels[value], value)));
  };
  fill(category, cards.map(card => card.dataset.category));
  fill(language, [...cards.flatMap(card => card.dataset.languages.split(' ')), 'en', 'fr']);
  const entries = cards.map(card => ({ card, text:normalize(card.dataset.search), words:words(card.dataset.search) }));
  function update() {
    const candidates = cards.filter(card => (!category.value || card.dataset.category === category.value) && (!language.value || card.dataset.languages.split(' ').includes(language.value)));
    const formats = [...new Set(candidates.map(card => card.dataset.format).filter(Boolean))].sort();
    const previous = format.value;
    format.length = 1;
    fill(format, formats);
    format.disabled = !formats.length;
    format.value = formats.includes(previous) ? previous : '';
    document.getElementById('format-help').textContent = format.disabled ? 'Format indisponible.' : 'Quiz/QCM : vocabulaire uniquement.';
    const terms = words(text.value);
    let count = 0;
    entries.forEach(entry => {
      const matchesText = terms.every(term => mode.value === 'whole' ? entry.words.includes(term) : entry.text.includes(term));
      const visible = candidates.includes(entry.card) && (!format.value || entry.card.dataset.format === format.value) && matchesText;
      entry.card.hidden = !visible;
      if (visible) count++;
    });
    document.getElementById('search-count').textContent = `${count} quiz affiché${count === 1 ? '' : 's'} sur ${cards.length}`;
    document.getElementById('search-empty').hidden = count !== 0;
  }
  [text, mode, category, language, format].forEach(control => control.addEventListener('input', update));
  update();
})();
</script>
<footer>Quiz de révision</footer></main></body></html>
