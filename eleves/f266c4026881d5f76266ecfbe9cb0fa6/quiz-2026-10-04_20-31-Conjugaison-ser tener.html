<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de conjugaison</title><style>

</style></head><body><main><header><div><h1 id="title">Quiz de conjugaison</h1><p class="muted">Réponses saisies · corrections instantanées</p></div><div id="score" aria-live="polite"></div></header>

const quizData={"language": "es", "sources": [{"title": "RAE, Diccionario del estudiante, Conjugación verbal, entradas SER y TENER", "url": "https://www.rae.es/diccionario-estudiante/docs/conjugaciones-verbales.pdf", "details": "pp. 1510-1511; paradigmas simples, imperativo y formas no personales consultados; tiempos compuestos formados con las formas de haber."}, {"title": "RAE-ASALE, Conjugación española", "url": "https://www.rae.es/buen-uso-espa%C3%B1ol/conjugaci%C3%B3n-espa%C3%B1ola", "details": "Tabla de verbos irregulares y auxiliares de los tiempos compuestos."}], "verbs": [{"infinitive": "ser", "forms": {"indicative-present": [["soy"], ["eres"], ["es"], ["somos"], ["sois"], ["son"]], "indicative-imperfect": [["era"], ["eras"], ["era"], ["éramos"], ["erais"], ["eran"]], "indicative-preterite": [["fui"], ["fuiste"], ["fue"], ["fuimos"], ["fuisteis"], ["fueron"]], "indicative-future": [["seré"], ["serás"], ["será"], ["seremos"], ["seréis"], ["serán"]], "conditional-present": [["sería"], ["serías"], ["sería"], ["seríamos"], ["seríais"], ["serían"]], "subjunctive-present": [["sea"], ["seas"], ["sea"], ["seamos"], ["seáis"], ["sean"]], "subjunctive-imperfect": [["fuera", "fuese"], ["fueras", "fueses"], ["fuera", "fuese"], ["fuéramos", "fuésemos"], ["fuerais", "fueseis"], ["fueran", "fuesen"]], "subjunctive-future": [["fuere"], ["fueres"], ["fuere"], ["fuéremos"], ["fuereis"], ["fueren"]], "imperative-present": [["sé"], ["sed"]], "imperative-negative": [["no seas"], ["no seáis"]], "infinitive-present": [["ser"]], "infinitive-perfect": [["haber sido"]], "gerund-present": [["siendo"]], "gerund-perfect": [["habiendo sido"]], "participle": [["sido"]], "indicative-perfect": [["he sido"], ["has sido"], ["ha sido"], ["hemos sido"], ["habéis sido"], ["han sido"]], "indicative-pluperfect": [["había sido"], ["habías sido"], ["había sido"], ["habíamos sido"], ["habíais sido"], ["habían sido"]], "indicative-anterior": [["hube sido"], ["hubiste sido"], ["hubo sido"], ["hubimos , "subjunctive-future": "Subjuntivo — futuro simple (rare)", "subjunctive-perfect": "Subjuntivo — pretérito perfecto", "subjunctive-pluperfect": "Subjuntivo — pluscuamperfecto (-ra / -se)", "subjunctive-future-perfect": "Subjuntivo — futuro compuesto (rare)", "imperative-present": "Imperativo — afirmativo", "imperative-negative": "Imperativo — negativo", "infinitive-present": "Infinitivo — simple", "infinitive-perfect": "Infinitivo — compuesto", "gerund-present": "Gerundio — simple", "gerund-perfect": "Gerundio — compuesto", "participle": "Participio"}, "persons": {"indicative-present": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-imperfect": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-preterite": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-future": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-perfect": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-pluperfect": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-anterior": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "indicative-future-perfect": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "conditional-present": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "conditional-perfect": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / ellas / ustedes"], "subjunctive-present": ["yo", "tú", "él / ella / usted", "nosotros / nosotras", "vosotros / vosotras", "ellos / const DEST_EMAIL='cyr.mail.internet@gmail.com';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyCVUodwmLrccCy0X39CoMQdIlxHckXt4bW6hv5kyF8_iR7qg_lDOYOthgRWSUt0L2I/exec';
const $=id=>document.getElementById(id);
let items=[],index=0,score=0,maxScore=0,answered=false,wrongAnswers=[],emailSent=false;
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[’‘]/g,"'").toLocaleLowerCase(quizData.language);
function distance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=0;i<a.length;i++){let next=[i+1];for(let j=0;j<b.length;j++)next[j+1]=Math.min(next[j]+1,row[j+1]+1,row[j]+(a[i]!==b[j]));row=next;}return row[b.length];}
function answerScore(value,alternatives){if(!norm(value))return 0;let d=Math.min(...alternatives.map(a=>distance(norm(value),norm(a))));return d===0?1:d===1?.25:0;}
function element(tag,text,className){const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;return e;}
function updateScore(final=false){const pct=maxScore?score/maxScore*100:0;$('score').textContent=`${score} / ${maxScore} points · ${Math.round(pct)} %`;if(final){$('score').style.background=pct<25?'#711d22':pct<=50?'#f4b5b8':pct<75?'#f1d45b':'#14633a';$('score').style.color=pct>=25&&pct<75?'#332b06':'white';}else{$('score').style.background='var(--blue)';$('score').style.color='white';}}
function closeReview(){$('review-toggle').disabled=true;$('review-toggle').setAttribute('aria-expanded','false');$('review-table').hidden=true;}
function sendResultEmail(){if(emailSent)return;emailSent=true;const pct=maxScore?Math.round(score/maxScore*100):0,stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=55?'⭐⭐⭐':pct>=35?'⭐⭐':'⭐',status=$('email-status');status.className='email-status sending';status.hidden=false;status.textContent='📧 Envoi du rapport en cours…';fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({score,total:maxScore,pct,stars,date:new Date().toLocaleString('fr-FR'),dest:DEST_EMAIL,mots_rates:wrongAnswers})}).then(()=>{status.className='email-status sent';status.textContent='✅ Rapport envoyé à '+DEST_EMAIL;}).catch(()=>{status.className='email-status error';status.textContent='⚠️ Erreur envoi — vérifie l’URL Apps Script';});}
function renderQuestion(){answered=false;closeReview();$('fields').replaceChildren();$('feedback').replaceChildren();$('next').disabled=true;
 if(index>=items.length){$('word').textContent='Terminé';$('progress').textContent=`${items.length} / ${items.length}`;$('validate').disabled=true;$('feedback').textContent=`Score final : ${score} / ${maxScore} points.`;updateScore(true);sendResultEmail();return;}
 $('validate').disabled=false;const item=items[index];$('word').textContent=item.infinitive;$('progress').textContent=`${index+1} / ${items.length}`;
 item.answers.forEach((a,i)=>{if(a===null)return;const label=element('label','', 'field');label.append(element('span',quizData.persons[$('tense').value][i]));const input=document.createElement('input');input.type='text';input.id=`answer-${i}`;input.required=true;input.spellcheck=false;input.setAttribute('aria-label',quizData.persons[$('tense').value][i]);label.append(input);$('fields').append(label);});
 $('feedback').textContent='Saisis les formes demandées, puis valide.';$('fields').querySelector('input')?.focus();}
function start(){items=quizData.verbs.map(v=>({infinitive:v.infinitive,answers:v.forms[$('tense').value]})).filter(v=>v.answers.some(a=>a!==null));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}index=0;score=0;wrongAnswers=[];emailSent=false;$('email-status').className='email-status';$('email-status').hidden=true;$('email-status').textContent='';maxScore=items.reduce((n,v)=>n+v.answers.filter(a=>a!==null).length,0);updateScore();renderQuestion();renderTable();}
function renderTable(){const table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');['Infinitif',...quizData.persons[$('tense').value]].forEach(p=>tr.append(element('th',p)));head.append(tr);table.append(head);const body=document.createElement('tbody');quizData.verbs.forEach(v=>{const r=document.createElement('tr');r.append(element('td',v.infinitive));v.forms[$('tense').value].forEach(a=>r.append(element('td',a===null?'—':a.join(' / '))));body.append(r);});table.append(body);$('review-table').replaceChildren(table);}
$('answer-form').addEventListener('submit',e=>{e.preventDefault();if(answered||index>=items.length)return;let gained=0;$('feedback').replaceChildren();items[index].answers.forEach((a,i)=>{if(a===null)return;const input=$(`answer-${i}`),points=answerScore(input.value,a);gained+=points;if(points<1)wrongAnswers.push({prompt:`${items[index].infinitive} — ${quizData.persons[$('tense').value][i]}`,correct:a.join(' / '),dir:`Quiz de conjugaison — ${quizData.catalog[$('tense').value]}`,given:input.value,points});const r=element('div',`${quizData.persons[$('tense').value][i]} : ${input.value} — ${points} / 1`,points===1?'result good':'result bad');if(points<1)r.append(element('span',`Correction : ${a.join(' / ')}`,'correction'));$('feedback').append(r);input.disabled=true;});score+=gained;answered=true;$('validate').disabled=true;$('next').disabled=false;$('review-toggle').disabled=gained===items[index].answers.filter(a=>a!==null).length;updateScore(index===items.length-1);});
