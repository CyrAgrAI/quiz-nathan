<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz espagnol — Superhéroes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; color: #fff; font-family: Poppins, sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .app { width: min(760px, 100%); }
    h1 { margin: 0; text-align: center; font: 3rem Bangers, cursive; letter-spacing: 2px; background: linear-gradient(90deg, #f7971e, #ffd200); color: transparent; background-clip: text; }
    .intro { margin: 4px 0 22px; text-align: center; color: #c4b5fd; }
    .panel { padding: clamp(18px, 4vw, 32px); border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: rgba(255,255,255,.08); backdrop-filter: blur(12px); box-shadow: 0 18px 55px rgba(0,0,0,.25); }
    .top { display: grid; justify-items: center; gap: 8px; }
    .chapter { color: #a78bfa; font-weight: 600; }
    .question-number { color: #ffd200; font: 1.35rem Bangers, cursive; letter-spacing: 1px; }
    .direction { display: grid; justify-items: center; gap: 4px; min-height: 56px; color: #c4b5fd; font-size: .82rem; font-weight: 600; }
    .flags { display: flex; align-items: center; gap: 10px; }
    .flags svg { width: 42px; height: 28px; border-radius: 4px; box-shadow: 0 2px 6px #0006; }
    .arrow { color: #a78bfa; font-size: 1.35rem; }
    .progress { height: 8px; margin: 22px 0; overflow: hidden; border-radius: 8px; background: #ffffff22; }
    .progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, #7c3aed, #f7971e); transition: width .25s; }
    .word { min-height: 58px; margin: 8px 0 20px; text-align: center; font-size: clamp(1.5rem, 5vw, 2.15rem); font-weight: 700; overflow-wrap: anywhere; }
    .word-es { color: #f87171; }
    .word-fr { color: #60a5fa; }
    .choices { display: grid; gap: 10px; }
    .choice { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 10px 14px; border: 1px solid #ffffff25; border-radius: 12px; color: #fff; background: #ffffff0d; font: 600 1rem Poppins, sans-serif; text-align: left; cursor: pointer; transition: transform .18s, background .18s, border-color .18s; }
    .choice:hover:not(:disabled) { transform: translateY(-2px); border-color: #a78bfa; background: #7c3aed55; }
    .choice:focus { outline: none; box-shadow: none; }
    .choice:disabled { cursor: default; }
    .letter { display: grid; flex: 0 0 30px; height: 30px; place-items: center; border-radius: 8px; color: #ffd200; background: #ffffff14; font: 1.1rem Bangers, cursive; }
    .choice.correct { border-color: #22c55e; background: #22c55e44; animation: bounce .35s; }
    .choice.wrong { border-color: #ef4444; background: #ef444444; animation: shake .35s; }
    @keyframes bounce { 50% { transform: scale(1.025); } }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; }
    .stats { display: flex; justify-content: center; gap: 18px; color: #c4b5fd; font-size: .75rem; }
    .stats b { display: block; color: #fff; text-align: center; font: 1.05rem Bangers, cursive; }
    .button { min-height: 42px; padding: 9px 16px; border: 1px solid #ffffff30; border-radius: 10px; color: #fff; background: #ffffff14; font: 600 .88rem Poppins, sans-serif; cursor: pointer; }
    .button:hover { background: #7c3aed88; }
    .button:focus { outline: none; }
    #continue { display: none; border-color: #7c3aed; background: #7c3aed66; }
    #result { display: none; text-align: center; }
    #result h2 { margin: 0; color: #ffd200; font: 2.4rem Bangers, cursive; }
    #result-score { margin: 8px 0; font: 1.4rem Bangers, cursive; }
    #stars { color: #ffd200; font-size: 1.5rem; letter-spacing: 4px; }
    #email-status { min-height: 24px; margin: 14px 0; color: #c4b5fd; font-size: .85rem; }
    .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    @media (max-width: 520px) { body { padding: 16px; } h1 { font-size: 2.5rem; } .bottom { flex-wrap: wrap; } .stats { order: 3; flex-basis: 100%; } }
  </style>
<script src="../../education-reporting.js"></script>
<script>window.EducationReporting ||= {start(){},complete(){}};</script>
</head>
<body>
  <main class="app">
    <h1>⚡ ESPAÑOL QUIZ ⚡</h1>
    <p class="intro">Superhéroes · 16 paires · 32 questions</p>
    <section class="panel" id="quiz" aria-live="polite">
      <div class="top">
        <div class="chapter">Espagnol-Superhéroes</div>
        <div class="question-number" id="question-number"></div>
        <div class="direction" id="direction"></div>
      </div>
      <div class="progress" aria-label="Progression"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="word" id="word"></div>
      <div class="choices" id="choices"></div>
      <div class="bottom">
        <button class="button" id="restart" type="button">↻ Recommencer</button>
        <div class="stats"><span><b id="correct-count">0</b>Bonnes</span><span><b id="wrong-count">0</b>Mauvaises</span><span><b id="score">0%</b>Score</span></div>
        <button class="button" id="continue" type="button">Continuer →</button>
      </div>
    </section>
    <section class="panel" id="result">
      <h2 id="result-title"></h2>
      <div id="result-score"></div>
      <div id="stars"></div>
      <div id="email-status" role="status"></div>
      <div class="result-actions"><button class="button" id="play-again" type="button">↻ Rejouer</button></div>
    </section>
  </main>
  <script>
    const DEST_EMAIL = "cyr.mail.internet@gmail.com";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCVUodwmLrccCy0X39CoMQdIlxHckXt4bW6hv5kyF8_iR7qg_lDOYOthgRWSUt0L2I/exec";
    const VOCAB = [
      ["los superhéroes", "les super-héros"], ["fuerte", "fort"], ["musculoso", "musclé"], ["tener", "avoir"],
      ["los superpoderes", "les super-pouvoirs"], ["volar", "voler (dans les airs)"], ["ser invisible", "être invisible"], ["los ojos láser", "les yeux laser"],
      ["ayudar", "aider"], ["salvar", "sauver"], ["la población", "la population"], ["querer", "vouloir"],
      ["la paz", "la paix"], ["la seguridad", "la sécurité"], ["luchar", "lutter"], ["los malos", "les méchants"]
    ];
    const ES_FLAG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" role="img" aria-label="Espagne"><rect width="60" height="40" fill="#aa151b"/><rect y="10" width="60" height="20" fill="#f1bf00"/></svg>';
    const FR_FLAG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" role="img" aria-label="France"><rect width="20" height="40" fill="#002395"/><rect x="20" width="20" height="40" fill="#fff"/><rect x="40" width="20" height="40" fill="#ed2939"/></svg>';
    const LETTERS = ["A", "B", "C", "D", "E"];
    let questions = [], index = 0, correct = 0, wrong = 0, wrongAnswers = [];
    const $ = id => document.getElementById(id);
    const shuffle = list => [...list].sort(() => Math.random() - 0.5);

    function buildQuestions() {
      return shuffle(VOCAB.flatMap(([es, fr]) => [
        { dir: "es", prompt: es, answer: fr },
        { dir: "fr", prompt: fr, answer: es }
      ]));
    }
    function updateStats() {
      $("correct-count").textContent = correct;
      $("wrong-count").textContent = wrong;
      $("score").textContent = `${correct + wrong ? Math.round(correct / (correct + wrong) * 100) : 0}%`;
    }
    function showQuestion() {
      if (index >= questions.length) return showResult();
      const q = questions[index];
      $("question-number").textContent = `Question ${index + 1} / ${questions.length}`;
      $("progress-fill").style.width = `${index / questions.length * 100}%`;
      $("direction").innerHTML = q.dir === "es"
        ? `<div class="flags">${ES_FLAG}<span class="arrow">→</span>${FR_FLAG}</div><span>Espagnol → Français</span>`
        : `<div class="flags">${FR_FLAG}<span class="arrow">→</span>${ES_FLAG}</div><span>Français → Espagnol</span>`;
      $("word").textContent = q.prompt;
      $("word").className = `word ${q.dir === "es" ? "word-es" : "word-fr"}`;
      $("continue").style.display = "none";
      const answers = q.dir === "es" ? VOCAB.map(pair => pair[1]) : VOCAB.map(pair => pair[0]);
      const options = shuffle([q.answer, ...shuffle(answers.filter(answer => answer !== q.answer)).slice(0, 4)]);
      $("choices").replaceChildren(...options.map((answer, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.innerHTML = `<span class="letter">${LETTERS[i]}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => handleAnswer(button, answer, q));
        return button;
      }));
    }
    function handleAnswer(button, selected, q) {
      const buttons = [...document.querySelectorAll(".choice")];
      buttons.forEach(item => { item.disabled = true; });
      if (selected === q.answer) {
        button.classList.add("correct");
        correct++;
        updateStats();
        setTimeout(nextQuestion, 1000);
      } else {
        button.classList.add("wrong");
        buttons.find(item => item.lastElementChild.textContent === q.answer)?.classList.add("correct");
        wrong++;
        wrongAnswers.push({ prompt: q.prompt, correct: q.answer, dir: q.dir === "es" ? "espagnol-francais" : "francais-espagnol" });
        updateStats();
        $("continue").style.display = "block";
      }
    }
    function nextQuestion() { index++; showQuestion(); }
    function showResult() {
      $("quiz").style.display = "none";
      $("result").style.display = "block";
      const pct = Math.round(correct / questions.length * 100);
      const tier = pct >= 90 ? ["LÉGENDAIRE ! 🔥", "★★★★★"] : pct >= 75 ? ["EXCELLENT ! 💪", "★★★★"] : pct >= 55 ? ["BIEN JOUÉ ! 😎", "★★★"] : pct >= 35 ? ["PAS MAL... 🤔", "★★"] : ["À RETRAVAILLER", "★"];
      $("result-title").textContent = tier[0];
      $("result-score").textContent = `${correct} / ${questions.length} — ${pct}%`;
      $("stars").textContent = tier[1];
      sendResultEmail(pct, tier[1]);
    }
    function sendResultEmail(pct, stars) { EducationReporting.complete(correct, questions.length);
      const status = $("email-status");
      status.textContent = "📧 Envoi du rapport en cours…";
      fetch(APPS_SCRIPT_URL, {
        method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ score: correct, total: questions.length, pct, stars, date: new Date().toLocaleString("fr-FR"), dest: DEST_EMAIL, nom_eleve: "Nathan AGRECH", mots_rates: wrongAnswers })
      }).then(() => { status.textContent = `✅ Rapport envoyé à ${DEST_EMAIL}`; })
        .catch(() => { status.textContent = "⚠️ Erreur d'envoi — vérifie l'URL Apps Script"; });
    }
    function initQuiz() { EducationReporting.start();
      index = correct = wrong = 0;
      wrongAnswers = [];
      questions = buildQuestions();
      $("quiz").style.display = "block";
      $("result").style.display = "none";
      updateStats();
      showQuestion();
    }
    $("continue").addEventListener("click", nextQuestion);
    $("restart").addEventListener("click", initQuiz);
    $("play-again").addEventListener("click", initQuiz);
    initQuiz();
  </script>
</body>
</html>
