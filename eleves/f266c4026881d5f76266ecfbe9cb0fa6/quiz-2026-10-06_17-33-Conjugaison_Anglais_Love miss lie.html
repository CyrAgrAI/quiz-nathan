<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de conjugaison</title><style>
:root{color-scheme:light;--ink:#22302f;--blue:#1d4ed8;--line:#d8d0c2}*{box-sizing:border-box}
body{margin:0;background:#f7f3ea;color:var(--ink);font-family:system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:12px 16px 20px;min-width:0}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}header p{margin:4px 0 0;overflow-wrap:anywhere}h1{font-size:clamp(1.7rem,4vw,2.5rem);margin:0;overflow-wrap:anywhere}.language-flag{width:32px;height:22px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:8px}.quiz-heading{display:flex;align-items:center;gap:10px;min-width:0}.quiz-heading>div{min-width:0}.quiz-type-icon{width:56px;height:56px;object-fit:contain;flex:none}
.muted{color:#596563}.email-status{margin-top:16px;padding:10px 14px;border-radius:8px;font-weight:650}.email-status.sending{display:block;color:#6541a5;background:#f4efff;border:1px solid #d7c6ff}.email-status.sent{display:block;color:#14633a;background:#eaf7ee;border:1px solid #a7d8b5}.email-status.error{display:block;color:#8f1d24;background:#fff0f0;border:1px solid #edb5b8}#score{padding:14px;border-radius:8px;background:var(--blue);color:white;font-weight:700;min-width:170px;max-width:100%}
.settings,.quiz{background:#fffdf8;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;min-width:0}.current-tense{display:none}
.settings label{display:block;font-weight:700;margin-bottom:4px}select{width:100%;min-height:44px;font:inherit;font-size:1.05rem;font-weight:700;padding:8px;border:1px solid var(--line);border-radius:6px;background:#14633a;color:white}select option{background:white;color:var(--ink)}
.question-heading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,4fr) minmax(0,1fr);align-items:center;gap:6px;margin-bottom:10px}#progress{overflow-wrap:anywhere}#word{font-size:clamp(2rem,7vw,4rem);font-weight:800;text-align:center;overflow-wrap:anywhere;margin:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
 .field{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-width:0}.field span{font-size:1rem;font-weight:750;overflow-wrap:anywhere}
textarea{display:block;width:100%;min-width:0;min-height:96px;resize:vertical;padding:8px 10px;font:700 1.1rem/1.35 system-ui;color:var(--blue);border:1px solid var(--line);border-radius:6px;background:white;white-space:pre-wrap;overflow-wrap:anywhere}
textarea:focus,select:focus,button:focus-visible{outline:3px solid #87b6f6;outline-offset:2px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{min-height:48px;padding:12px 18px;border:0;border-radius:6px;font:700 1rem system-ui;cursor:pointer;background:var(--blue);color:white;max-width:100%;overflow-wrap:anywhere}
button[type=submit]{background:#1f7a45}#restart,#review-toggle{background:#dedbd3;color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}
#feedback{margin-top:12px;display:grid;gap:6px;overflow-wrap:anywhere}.result{padding:7px 10px;border-radius:6px;border:1px solid var(--line);font-size:1rem;line-height:1.35}.good{background:#14633a;color:#fff}.bad{background:#8f1d24;color:#fff}.correction{display:inline;margin:0 0 0 6px;color:inherit;font-weight:750}
#review{margin-top:10px}.table-wrap{overflow:auto;margin-top:10px;border:1px solid var(--line);background:#fffdf8}table{border-collapse:collapse;width:100%;min-width:580px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);max-width:380px;overflow-wrap:anywhere}th{background:#ece5d8}
[hidden]{display:none!important}@media(max-width:640px){main{padding:10px 10px 18px}.settings,.quiz{padding:10px}.fields{grid-template-columns:1fr}textarea{font-size:1.05rem}.current-tense{display:block;margin:6px 0 0;font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}header{align-items:stretch}#score{width:100%;min-width:0}}

const DEST_EMAIL='cyr.mail.internet@gmail.com';
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbyCVUodwmLrccCy0X39CoMQdIlxHckXt4bW6hv5kyF8_iR7qg_lDOYOthgRWSUt0L2I/exec';
const $=id=>document.getElementById(id);
let items=[],index=0,score=0,maxScore=0,answered=false,wrongAnswers=[],emailSent=false;
const norm=s=>s.normalize('NFC').trim().replace(/\s+/g,' ').replace(/[’‘]/g,"'").toLocaleLowerCase(quizData.language);
function distance(a,b){let row=Array.from({length:b.length+1},(_,i)=>i);for(let i=0;i<a.length;i++){let next=[i+1];for(let j=0;j<b.length;j++)next[j+1]=Math.min(next[j]+1,row[j+1]+1,row[j]+(a[i]!==b[j]));row=next;}return row[b.length];}
function answerScore(value,alternatives){if(!norm(value))return 0;let d=Math.min(...alternatives.map(a=>distance(norm(value),norm(a))));return d===0?1:d===1?.25:0;}
function element(tag,text,className){const e=document.createElement(tag);e.textContent=text;if(className)e.className=className;return e;}
function updateScore(final=false){const pct=maxScore?score/maxScore*100:0;$('score').textContent=`${score} / ${maxScore} points · ${Math.round(pct)} %`;if(final){$('score').style.background=pct<25?'#711d22':pct<=50?'#f4b5b8':pct<75?'#f1d45b':'#14633a';$('score').style.color=pct>=25&&pct<75?'#332b06':'white';}else{$('score').style.background='var(--blue)';$('score').style.color='white';}}
function closeReview(){$('review-toggle').disabled=true;$('review-toggle').setAttribute('aria-expanded','false');$('review-table').hidden=true;}
function sendResultEmail(){if(emailSent)return;emailSent=true;const pct=maxScore?Math.round(score/maxScore*100):0,stars=pct>=90?'⭐⭐⭐⭐⭐':pct>=75?'⭐⭐⭐⭐':pct>=55?'⭐⭐⭐':pct>=35?'⭐⭐':'⭐',status=$('email-status');status.className='email-status sending';status.hidden=false;status.textContent='📧 Envoi du rapport en cours…';fetch(APPS_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({score,total:maxScore,pct,stars,date:new Date().toLocaleString('fr-FR'),dest:DEST_EMAIL, nom_eleve: "Nathan AGRECH",mots_rates:wrongAnswers})}).then(()=>{status.className='email-status sent';status.textContent='✅ Rapport envoyé à '+DEST_EMAIL;}).catch(()=>{status.className='email-status error';status.textContent='⚠️ Erreur envoi — vérifie l’URL Apps Script';});}
function renderQuestion(){answered=false;closeReview();$('fields').replaceChildren();$('feedback').replaceChildren();$('next').disabled=true;
 if(index>=items.length){$('word').textContent='Terminé';$('progress').textContent=`${items.length} / ${items.length}`;$('validate').disabled=true;$('feedback').textContent=`Score final : ${score} / ${maxScore} points.`;updateScore(true);sendResultEmail();return;}
 $('validate').disabled=false;const item=items[index];$('word').textContent=item.infinitive;$('progress').textContent=`${index+1} / ${items.length}`;
 item.answers.forEach((a,i)=>{if(a===null)return;const label=element('label','', 'field');label.append(element('span',quizData.persons[$('tense').value][i]));const textarea=document.createElement('textarea');textarea.id=`answer-${i}`;textarea.rows=4;textarea.required=true;textarea.spellcheck=false;textarea.setAttribute('aria-label',quizData.persons[$('tense').value][i]);label.append(textarea);$('fields').append(label);});
 $('feedback').textContent='Saisis les formes demandées, puis valide.';$('fields').querySelector('textarea')?.focus();}
function start(){items=quizData.verbs.map(v=>({infinitive:v.infinitive,answers:v.forms[$('tense').value]})).filter(v=>v.answers.some(a=>a!==null));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}index=0;score=0;wrongAnswers=[];emailSent=false;$('email-status').className='email-status';$('email-status').hidden=true;$('email-status').textContent='';maxScore=items.reduce((n,v)=>n+v.answers.filter(a=>a!==null).length,0);updateScore();renderQuestion();renderTable();}
function renderTable(){const table=document.createElement('table'),head=document.createElement('thead'),tr=document.createElement('tr');['Infinitif',...quizData.persons[$('tense').value]].forEach(p=>tr.append(element('th',p)));head.append(tr);table.append(head);const body=document.createElement('tbody');quizData.verbs.forEach(v=>{const r=document.createElement('tr');r.append(element('td',v.infinitive));v.forms[$('tense').value].forEach(a=>r.append(element('td',a===null?'—':a.join(' / '))));body.append(r);});table.append(body);$('review-table').replaceChildren(table);}
$('answer-form').addEventListener('submit',e=>{e.preventDefault();if(answered||index>=items.length)return;let gained=0;$('feedback').replaceChildren();items[index].answers.forEach((a,i)=>{if(a===null)return;const input=$(`answer-${i}`),points=answerScore(input.value,a);gained+=points;if(points<1)wrongAnswers.push({prompt:`${items[index].infinitive} — ${quizData.persons[$('tense').value][i]}`,correct:a.join(' / '),dir:`Quiz de conjugaison — ${quizData.catalog[$('tense').value]}`,given:input.value,points});const r=element('div',`${quizData.persons[$('tense').value][i]} : ${input.value} — ${points} / 1`,points===1?'result good':'result bad');if(points<1)r.append(element('span',`Correction : ${a.join(' / ')}`,'correction'));$('feedback').append(r);input.disabled=true;});score+=gained;answered=true;$('validate').disabled=true;$('next').disabled=false;$('review-toggle').disabled=gained===items[index].answers.filter(a=>a!==null).length;updateScore(index===items.length-1);});
$('next').addEventListener('click',()=>{if(!answered)return;index++;renderQuestion();});$('restart').addEventListener('click',start);$('review-toggle').addEventListener('click',()=>{$('review-table').hidden=!$('review-table').hidden;$('review-toggle').setAttribute('aria-expanded',String(!$('review-table').hidden));});
function syncTenseLabel(){$('current-tense').textContent=$('tense').selectedOptions[0]?.textContent??'';}
Object.entries(quizData.catalog).forEach(([id,text])=>{const option=element('option',text);option.value=id;$('tense').append(option);});$('tense').value=quizData.selected;syncTenseLabel();$('tense').addEventListener('change',()=>{syncTenseLabel();start();});start();
