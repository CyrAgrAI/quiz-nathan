<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="quiz-language" content="en">
<meta name="quiz-format" content="qcm">
<title>English QCM — Vocabulaire_Anglais_Profiling my series</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Poppins',sans-serif; background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); min-height:100vh; display:flex; align-items:center; justify-content:center; color:#fff; padding:20px; }
.container { max-width:560px; width:100%; }
h1 { font-family:'Bangers',cursive; font-size:2.8rem; text-align:center; background:linear-gradient(to right,#f7971e,#ffd200); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:3px; margin-bottom:6px; }
.progress-bar-wrap { background:rgba(255,255,255,.1); border-radius:8px; height:8px; margin-bottom:20px; overflow:hidden; }
.progress-bar { height:100%; background:linear-gradient(to right,#7c3aed,#f97316); border-radius:8px; transition:width .4s ease; }
.card,.result-card { background:rgba(255,255,255,.07); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:26px 28px 20px; }
.card-top { display:flex; flex-direction:column; margin-bottom:14px; }
.subtitle { text-align:center; color:#a78bfa; font-size:1.15rem; font-weight:600; margin-bottom:10px; overflow-wrap:anywhere; }
.question-num { font-family:'Bangers',cursive; font-size:1.4rem; color:#ffd200; letter-spacing:1px; margin-bottom:4px; }
.direction-badge { display:flex; flex-direction:column; align-items:center; gap:5px; margin-bottom:10px; }
.flag-row { display:flex; align-items:center; gap:10px; }
.direction-badge img { height:2.4rem; border-radius:4px; display:block; }
.arrow { font-size:1.6rem; color:#a78bfa; }
.flag-label { font-size:.78rem; font-weight:600; letter-spacing:.5px; color:#a78bfa; }
.question-text { font-size:1.7rem; font-weight:700; text-align:center; margin-bottom:22px; min-height:2.2rem; overflow-wrap:anywhere; }
.question-text.word-target { color:#f87171; }
.question-text.word-fr { color:#60a5fa; }
.choices { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.choice-btn { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.2); border-radius:12px; padding:12px 16px; color:#fff; font-family:'Poppins',sans-serif; font-size:.95rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:12px; transition:all .18s; text-align:left; overflow-wrap:anywhere; }
.choice-btn:hover:not(:disabled) { background:rgba(124,58,237,.35); border-color:#7c3aed; transform:translateY(-2px); }
.choice-btn:focus { outline:none; box-shadow:none; }
.choice-btn:disabled { cursor:default; }
.letter { font-family:'Bangers',cursive; font-size:1.1rem; color:#a78bfa; width:22px; flex-shrink:0; }
.choice-btn.correct { background:rgba(34,197,94,.25); border-color:#22c55e; animation:bounce .4s; }
.choice-btn.wrong { background:rgba(239,68,68,.25); border-color:#ef4444; animation:shake .4s; }
@keyframes bounce { 0%,100% { transform:translateY(0); } 40% { transform:translateY(-8px); } 60% { transform:translateY(-4px); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 20%,60% { transform:translateX(-6px); } 40%,80% { transform:translateX(6px); } }
.card-bottom { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:center; margin-top:14px; }
.hud-inline { grid-column:1 / -1; grid-row:1; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:center; }
.hud-item { display:flex; flex-direction:column; align-items:center; }
.hud-val { font-family:'Bangers',cursive; font-size:1rem; letter-spacing:1px; }
.hud-lbl { font-size:.58rem; font-weight:600; color:#a78bfa; }
.restart-btn { grid-column:1; grid-row:2; justify-self:start; background:rgba(156,163,175,.15); border:1px solid #9ca3af; border-radius:10px; padding:10px 18px; color:#d1d5db; font-family:'Poppins',sans-serif; font-size:.85rem; font-weight:600; cursor:pointer; transition:all .18s; }
.restart-btn:hover { background:rgba(156,163,175,.35); transform:translateY(-1px); }
.restart-btn:focus,.next-btn:focus { outline:none; }
.next-btn-wrap { display:none; grid-column:2; grid-row:2; justify-self:end; }
.next-btn { background:rgba(124,58,237,.35); border:1px solid #7c3aed; border-radius:10px; padding:10px 24px; color:#fff; font-family:'Poppins',sans-serif; font-size:.95rem; font-weight:600; cursor:pointer; transition:all .18s; }
.next-btn:hover { background:rgba(124,58,237,.6); transform:translateY(-1px); }
.result-card { padding:36px 28px; text-align:center; display:none; }
.result-title { font-family:'Bangers',cursive; font-size:2.4rem; letter-spacing:2px; margin-bottom:10px; color:#ffd200; }
.result-stars { font-size:2rem; margin-bottom:14px; }
.result-score { font-size:1.15rem; color:#c4b5fd; margin-bottom:20px; }
.result-pct { font-family:'Bangers',cursive; font-size:3rem; }
.replay-btn { background:linear-gradient(135deg,#7c3aed,#a855f7); border:none; border-radius:12px; padding:14px 36px; color:#fff; font-family:'Bangers',cursive; font-size:1.3rem; letter-spacing:1px; cursor:pointer; transition:all .2s; margin-top:10px; }
.replay-btn:hover { transform:translateY(-2px); opacity:.9; }
.email-status { margin-top:16px; font-size:.85rem; padding:10px 18px; border-radius:10px; font-weight:600; display:none; overflow-wrap:anywhere; }
.email-status.sending { display:block; color:#a78bfa; background:rgba(167,139,250,.1); border:1px solid rgba(167,139,250,.3); }
.email-status.sent { display:block; color:#86efac; background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.3); }
.email-status.error { display:block; color:#fca5a5; background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); }
@media(max-width:400px) { body { padding:12px; } .card { padding:20px 14px; } h1 { font-size:2.4rem; } .restart-btn,.next-btn { padding:10px 8px; font-size:.8rem; } }
</style>
<script src="../../education-reporting.js"></script>
<script>window.EducationReporting ||= {start(){},complete(){}};</script>
</head>
<body>
<div class="container">
<h1>⚡ ENGLISH QCM ⚡</h1>
<div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>
<div class="card" id="question-card">
<div class="card-top"><p class="subtitle" id="subtitle">Vocabulaire_Anglais_Profiling my series</p><div class="question-num" id="question-num"></div><div id="direction-badge" class="direction-badge"></div></div>
<div class="question-text" id="question-text"></div><div class="choices" id="choices"></div>
<div class="card-bottom">
<button class="restart-btn" type="button" onclick="initQuiz()">🔄 Recommencer</button>
<div class="hud-inline">
<div class="hud-item"><span class="hud-val" id="hud-correct">✅ 0</span><span class="hud-lbl">Bonnes</span></div>
<div class="hud-item"><span class="hud-val" id="hud-pct">🎯 0 / 20</span><span class="hud-lbl">Score</span></div>
<div class="hud-item"><span class="hud-val" id="hud-wrong">❌ 0</span><span class="hud-lbl">Mauvaises</span></div>
</div>
<div class="next-btn-wrap" id="next-btn-wrap"><button class="next-btn" type="button" onclick="nextQuestion()">Continuer →</button></div>
</div></div>
<div class="result-card" id="result-card">
<div class="result-title" id="result-title"></div><div class="result-stars" id="result-stars"></div>
<div class="result-score"><div class="result-pct" id="result-pct"></div><div id="result-detail"></div></div>
<button class="replay-btn" type="button" onclick="initQuiz()">🔄 REJOUER</button><div class="email-status" id="email-status" role="status"></div>
</div></div>
<script>
const DEST_EMAIL = "cyr.mail.internet@gmail.com";
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCVUodwmLrccCy0X39CoMQdIlxHckXt4bW6hv5kyF8_iR7qg_lDOYOthgRWSUt0L2I/exec";
const CONFIG = {"name_fr": "Anglais", "title": "English QCM", "aliases": ["anglais", "english", "eng"], "flag": "en", "csv_forward": "ENG-FR_{slug}.csv", "csv_reverse": "FR-EN_{slug}.csv", "report_forward": "eng", "report_reverse": "fr", "code": "en", "slug": "Vocabulaire_Anglais_Profiling my series"};
const VOCAB = [["help", "aider / l’aide"], ["funny", "drôle"], ["strong", "fort"], ["brave", "courageux"], ["ambiguous", "ambigu"], ["joke", "blague"], ["friend", "ami"], ["hilarious", "hilarant"], ["gadgets", "gadgets / objets technologiques"], ["look for", "chercher"], ["create", "créer"], ["evil", "méchant / maléfique"], ["faults", "défauts"], ["kill", "tuer"], ["solve", "résoudre"], ["mislead", "induire en erreur"], ["fight", "combattre / se battre"], ["heroic", "héroïque"], ["reduce tension", "réduire la tension"], ["qualities", "qualités"], ["courageous", "courageux"], ["laugh", "rire"], ["lonely", "seul / solitaire"]];
const FLAGS = {
en: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'><rect width='60' height='30' fill='#012169'/><path d='M0,0 L60,30 M60,0 L0,30' stroke='#fff' stroke-width='6'/><path d='M0,0 L60,30 M60,0 L0,30' stroke='#C8102E' stroke-width='4'/><path d='M30,0 V30 M0,15 H60' stroke='#fff' stroke-width='10'/><path d='M30,0 V30 M0,15 H60' stroke='#C8102E' stroke-width='6'/></svg>",
fr: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'><rect width='1' height='2' fill='#002395'/><rect x='1' width='1' height='2' fill='#EDEDED'/><rect x='2' width='1' height='2' fill='#ED2939'/></svg>",
es: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#aa151b'/><rect y='10' width='60' height='20' fill='#f1bf00'/></svg>",
de: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#ffce00'/><rect width='60' height='27' fill='#dd0000'/><rect width='60' height='13' fill='#000'/></svg>",
it: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#fff'/><rect width='20' height='40' fill='#009246'/><rect x='40' width='20' height='40' fill='#ce2b37'/></svg>",
pt: "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 40'><rect width='60' height='40' fill='#ff0000'/><rect width='24' height='40' fill='#006600'/><circle cx='24' cy='20' r='8' fill='#ffcc00'/><path d='M20 15H28V23Q24 29 20 23Z' fill='#fff' stroke='#ff0000' stroke-width='2'/></svg>"
};
const LETTERS = ["A","B","C","D","E"];
let questions = [], currentIndex = 0, correct = 0, wrong = 0, wrongAnswers = [], advanceTimer = null;
const $ = id => document.getElementById(id);
function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildQuestions() {
  const targetPool=[...new Set(VOCAB.map(p=>p[0]))], frenchPool=[...new Set(VOCAB.map(p=>p[1]))];
  const qs=[];
  VOCAB.forEach(([target,fr])=>{
    qs.push({dir:CONFIG.report_forward, forward:true, prompt:target, answer:fr, choices:shuffle([fr,...shuffle(frenchPool.filter(x=>x!==fr)).slice(0,4)])});
    qs.push({dir:CONFIG.report_reverse, forward:false, prompt:fr, answer:target, choices:shuffle([target,...shuffle(targetPool.filter(x=>x!==target)).slice(0,4)])});
  });
  return shuffle(qs);
}
function initQuiz() { EducationReporting.start();
  clearTimeout(advanceTimer); advanceTimer=null;
  questions=buildQuestions(); currentIndex=correct=wrong=0; wrongAnswers=[];
  $("question-card").style.display=""; $("result-card").style.display="none"; $("email-status").className="email-status";
  updateHUD(); showQuestion();
}
function scoreColor(pct) { return pct<25?"#ef4444":pct<50?"#f97316":pct<=75?"#ffd200":"#22c55e"; }
function note(pct) { return (pct/5).toLocaleString("fr-FR",{maximumFractionDigits:1})+" / 20"; }
function updateHUD() {
  const answered=correct+wrong, pct=answered?correct/answered*100:0;
  $("hud-correct").textContent="✅ "+correct; $("hud-wrong").textContent="❌ "+wrong;
  $("hud-pct").textContent="🎯 "+note(pct); $("hud-pct").style.color=scoreColor(pct);
}
function flag(code,label) {
  if(!Object.prototype.hasOwnProperty.call(FLAGS,code)) {
    const text=document.createElement("span"); text.textContent=label; return text;
  }
  const img=document.createElement("img");
  img.src="data:image/svg+xml,"+encodeURIComponent(FLAGS[code]); img.alt=label;
  return img;
}
function showQuestion() {
  const q=questions[currentIndex];
  $("progress-bar").style.width=currentIndex/questions.length*100+"%";
  $("question-num").textContent="Question "+(currentIndex+1)+" / "+questions.length;
  $("next-btn-wrap").style.display="none";
  const row=document.createElement("div"); row.className="flag-row";
  const arrow=document.createElement("span"); arrow.className="arrow"; arrow.textContent="→";
  row.append(flag(q.forward?CONFIG.flag:"fr",q.forward?CONFIG.name_fr:"Français"),arrow,flag(q.forward?"fr":CONFIG.flag,q.forward?"Français":CONFIG.name_fr));
  const label=document.createElement("div"); label.className="flag-label";
  label.textContent=q.forward?CONFIG.name_fr+" → Français":"Français → "+CONFIG.name_fr;
  $("direction-badge").replaceChildren(row,label);
  $("question-text").textContent=q.prompt; $("question-text").className="question-text "+(q.forward?"word-target":"word-fr");
  $("question-text").dir=q.forward?(CONFIG.direction||"ltr"):"ltr";
  $("choices").replaceChildren(...q.choices.map((choice,i)=>{
    const btn=document.createElement("button"); btn.type="button"; btn.className="choice-btn";
    const letter=document.createElement("span"); letter.className="letter"; letter.textContent=LETTERS[i];
    const text=document.createElement("span"); text.textContent=choice; text.dir=q.forward?"ltr":(CONFIG.direction||"ltr");
    btn.append(letter,text); btn.onclick=()=>handleAnswer(btn,choice,q); return btn;
  }));
}
function handleAnswer(btn,selected,q) {
  if(btn.disabled) return;
  const btns=document.querySelectorAll(".choice-btn");
  btns.forEach(b=>{b.disabled=true;b.blur();});
  if(selected===q.answer) {
    btn.classList.add("correct"); correct++; updateHUD(); advanceTimer=setTimeout(nextQuestion,1000);
  } else {
    btn.classList.add("wrong"); wrong++; wrongAnswers.push({prompt:q.prompt,correct:q.answer,dir:q.dir});
    btns.forEach(b=>{if(b.lastElementChild.textContent===q.answer)b.classList.add("correct");});
    updateHUD(); $("next-btn-wrap").style.display="block";
  }
}
function nextQuestion() {
  clearTimeout(advanceTimer); advanceTimer=null;
  currentIndex++; if(currentIndex<questions.length)showQuestion();else showResult();
}
function showResult() {
  $("question-card").style.display="none"; $("result-card").style.display="block";
  const total=questions.length, rawPct=correct/(correct+wrong)*100, pct=Math.round(rawPct);
  const tier=pct>=90?["LÉGENDAIRE ! 🔥","⭐⭐⭐⭐⭐"]:pct>=75?["EXCELLENT ! 💪","⭐⭐⭐⭐"]:pct>=55?["BIEN JOUÉ ! 😎","⭐⭐⭐"]:pct>=35?["PAS MAL... 🤔","⭐⭐"]:["À RETRAVAILLER 😅","⭐"];
  $("result-title").textContent=tier[0]; $("result-stars").textContent=tier[1];
  $("result-pct").textContent=note(rawPct); $("result-pct").style.color=scoreColor(rawPct);
  $("result-detail").textContent=correct+" / "+total+" bonnes réponses";
  $("progress-bar").style.width="100%"; sendResultEmail(pct,total,tier[1]);
}
function sendResultEmail(pct,total,stars) { EducationReporting.complete(correct, questions.length);
  const statusEl=$("email-status"); statusEl.className="email-status sending"; statusEl.textContent="📧 Envoi du rapport en cours…";
  const date=new Date().toLocaleDateString("fr-FR",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
  fetch(APPS_SCRIPT_URL,{
    method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({score:correct,total,pct,stars,date,dest:DEST_EMAIL, nom_eleve: "Nathan AGRECH",mots_rates:wrongAnswers})
  }).then(()=>{
    statusEl.className="email-status sent"; statusEl.textContent="📧 Demande de rapport transmise ; réception non confirmée.";
  }).catch(()=>{
    statusEl.className="email-status error"; statusEl.textContent="⚠️ Erreur envoi — vérifie l'URL Apps Script";
  });
}
initQuiz();
</script>
</body>
</html>
